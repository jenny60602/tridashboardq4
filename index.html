<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三小市集 Q4 專案 x 人力儀表板</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#2b2a26; --sub:#6b6a63; --line:#e4e1d8;
  --accent:#3f6b4a; --accent2:#b5651d; --warn:#c0392b; --ok:#2e7d32; --yellow:#b7950b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1b18;--card:#26251f;--ink:#ece9e1;--sub:#a9a69c;--line:#3a3830;}
}
:root[data-theme="dark"]{--bg:#1c1b18;--card:#26251f;--ink:#ece9e1;--sub:#a9a69c;--line:#3a3830;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;}
header{padding:20px 16px 8px;max-width:1260px;margin:0 auto;}
h1{font-size:1.3rem;margin:0 0 4px;}
.sub{color:var(--sub);font-size:.82rem;margin-bottom:10px;}
.whoami{font-size:.78rem;color:var(--sub);margin-bottom:10px;}
.whoami select{font-size:.78rem;padding:3px 6px;}
body.locked main, body.locked #stats{display:none;}
.logincard{max-width:420px;margin:28px 0;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:.88rem;color:var(--ink);}
.logincard input{font-size:.9rem;padding:6px 8px;width:180px;}
.logincard button{font-size:.85rem;padding:6px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
.statgroup{margin-bottom:8px;}
.statgrouplabel{font-size:.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 4px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px;}
.stat.clickable{cursor:pointer;}
.stat.clickable:hover{border-color:var(--accent2);}
.stat b{display:block;font-size:1.05rem;}
.stat span{color:var(--sub);font-size:.7rem;}
.stat span.small{display:block;margin-top:2px;}
main{max-width:1260px;margin:0 auto;padding:0 16px 40px;}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:20px;font-size:.85rem;cursor:pointer;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;}
.filters{display:flex;gap:6px;flex-wrap:wrap;}
.filters button{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:4px 11px;border-radius:16px;font-size:.75rem;cursor:pointer;}
.filters button.active{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.statusfilters button.active{background:var(--accent);border-color:var(--accent);}
.filterdivider{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
.filterlabel{font-size:.72rem;color:var(--sub);align-self:center;}
#searchbox{padding:5px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-size:.78rem;width:180px;}
.priority{border:1px solid var(--warn);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.priority h3{margin:0 0 8px;font-size:.88rem;color:var(--warn);}
.priority.ok{border-color:var(--ok);} .priority.ok h3{color:var(--ok);}
.priority.plain{border-color:var(--line);}
.priority.plain h3{color:var(--ink);margin:0 0 6px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;padding:4px 0;border-bottom:1px dashed var(--line);}
.row:last-child{border-bottom:none;}
.trow{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:4px 0;border-bottom:1px dashed var(--line);}
.trow:last-child{border-bottom:none;}
.badge{font-size:.68rem;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;}
.badge.overdue{background:#fbe4e1;color:var(--warn);}
.badge.soon7{background:#fdecd2;color:var(--accent2);}
.badge.soon30{background:#faf3cf;color:var(--yellow);}
.badge.later{background:var(--line);color:var(--sub);}
@media (prefers-color-scheme: dark){
  .badge.overdue{background:#3a1f1c;} .badge.soon7{background:#3a2c14;} .badge.soon30{background:#332f14;}
}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);}
table{border-collapse:collapse;width:100%;font-size:.81rem;min-width:1020px;}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top;}
th{color:var(--sub);font-weight:600;font-size:.68rem;text-transform:uppercase;position:sticky;top:0;background:var(--card);}
td.name{white-space:normal;min-width:170px;cursor:pointer;}
td.name .arrow{display:inline-block;width:14px;color:var(--sub);}
td.name .drive{margin-left:4px;text-decoration:none;}
.cat{display:inline-block;font-size:.7rem;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--sub);}
select,input[type=number],input[type=text],input[type=date],input[type=url]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:.76rem;}
.mddate{width:56px;}
.subname{width:150px;}
.subnote{width:110px;}
.tname-input{font-weight:600;background:transparent;border:1px solid transparent;padding:2px 4px;}
.tname-input:hover,.tname-input:focus{border-color:var(--line);background:var(--card);}
.status-未開始{color:var(--sub);} .status-進行中{color:var(--accent2);font-weight:600;} .status-待收款{color:var(--warn);font-weight:600;} .status-已完成{color:var(--ok);}
.rev{text-align:right;font-variant-numeric:tabular-nums;}
.diff{font-size:.66rem;display:block;margin-top:2px;}
.diff.short{color:var(--warn);} .diff.over{color:var(--ok);} .diff.wait{color:var(--sub);}
.costnote{font-size:.66rem;display:block;margin-top:2px;}
.costnote.over{color:var(--warn);font-weight:600;} .costnote.near{color:var(--accent2);} .costnote.ok{color:var(--sub);}
.progwrap{display:flex;align-items:center;gap:6px;min-width:90px;}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--accent);}
.progtxt{font-size:.7rem;color:var(--sub);white-space:nowrap;}
.detail td{background:var(--bg);white-space:normal;}
tr.rowopen td{background:#f9e8bd;}
tr.rowopen td:first-child{box-shadow:inset 4px 0 0 var(--accent2);}
.detailwrap{display:grid;grid-template-columns:minmax(0,1fr);}
.detail h4{font-size:.72rem;color:var(--sub);margin:10px 0 6px;text-transform:uppercase;}
.detail h4:first-child{margin-top:0;}
.dtabs{display:flex;gap:6px;margin-bottom:10px;}
.dtab{background:var(--card);border:1px solid var(--line);color:var(--sub);padding:4px 12px;border-radius:14px;font-size:.75rem;cursor:pointer;}
.dtab.active{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.gantt{margin-bottom:14px;}
.ganttscroll{width:1px;min-width:100%;overflow:auto;max-height:420px;}
.gantthead{position:sticky;top:0;z-index:6;background:var(--bg);}
.ganttaxis{display:flex;justify-content:space-between;font-size:.68rem;color:var(--sub);margin-bottom:4px;}
.ganttbody{position:relative;}
.ganttrow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:.74rem;}
.ganttlabel{width:250px;flex-shrink:0;position:sticky;left:0;background:var(--bg);z-index:2;padding-right:4px;}
.ganttgrouprow{padding-top:8px;}
.ganttweekrow{border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px;}
.ganttweeklabel{position:absolute;top:0;font-size:.64rem;color:var(--sub);white-space:nowrap;padding-left:2px;}
.ganttgrouprow .ganttbar-group{background:rgba(184,134,11,0.32);border:1px solid #b8860b;height:12px;top:2px;border-radius:5px;}
.ganttchildrow{padding-left:0;}
.ganttdate{position:absolute;top:0;font-size:.66rem;color:var(--sub);white-space:nowrap;line-height:16px;}
.ganttmilestone{position:absolute;top:2px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);border-radius:2px;}
.ganttgrouphead{font-size:.72rem;color:var(--sub);font-weight:600;margin-top:6px;}
.ganttbararea{flex:1;position:relative;height:16px;background:var(--card);border-radius:3px;}
.ganttgrid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);}
.ganttbar{position:absolute;top:0;height:16px;border-radius:3px;}
.ganttbar-staff{background:var(--accent);}
.ganttbar-partner{background:var(--accent2);}
.ganttbar-vendor{background:#c9a227;}
.ganttbar-none{background:var(--line);}
.ownbar-normal{background:#8fb28f;}
.ownbar-lag{background:#d3a86a;}
.ownbar-overdue{background:var(--warn);}
.ownbar-done{background:var(--line);}
.collabbar{opacity:.55;border:1px dashed rgba(0,0,0,.35);}
.ganttbar-done{opacity:.35;}
.ganttToday{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);z-index:2;}
.ganttEventDot{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#2c5f7c;border:2px solid #fff;z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.ganttEventLabel{position:absolute;top:50%;transform:translateY(-50%);font-size:.66rem;line-height:1.35;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.93);color:#2c5f7c;font-weight:600;white-space:nowrap;z-index:4;box-shadow:0 0 0 1px rgba(0,0,0,.10);}
.ganttEventLabel.collab{color:#7a5a99;}
.ganttEventLabel.lower{transform:none;}
.ganttEventDotCollab{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#9b7cb6;border:2px solid #fff;z-index:3;box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.ganttEventLine{position:absolute;top:0;bottom:0;width:2px;background:#2c5f7c;z-index:1;opacity:.55;}
.notesbox{width:100%;min-height:70px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:.8rem;font-family:inherit;resize:vertical;}
.monthgridscroll{overflow-x:auto;margin-top:6px;}
.monthgrid{display:flex;gap:8px;flex-wrap:nowrap;}
.monthcol{flex:1 1 200px;min-width:170px;max-width:260px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
.monthcolhead{font-weight:600;font-size:.78rem;margin-bottom:4px;color:var(--accent2);}
.monthitem{font-size:.68rem;padding:2px 0;border-bottom:1px dashed var(--line);}
.monthproj{color:var(--accent2);font-weight:600;}
.monthitem.done{opacity:.4;text-decoration:line-through;}
.basicgrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.basicgrid label{font-size:.7rem;color:var(--sub);display:flex;flex-direction:column;gap:3px;}
.collab{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.collab label{display:flex;align-items:center;gap:4px;font-size:.78rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px 9px;}
.tag-staff{background:#dfe9df;color:var(--accent);padding:1px 6px;border-radius:5px;font-size:.68rem;}
.tag-partner{background:#f4e3c9;color:var(--accent2);padding:1px 6px;border-radius:5px;font-size:.68rem;}
.tag-vendor{background:#f3e6c4;color:#8a6d1a;padding:1px 6px;border-radius:5px;font-size:.68rem;}
.tasklist{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.taskitem{border-bottom:1px dashed var(--line);padding-bottom:6px;}
.taskitem.custom .tname{color:var(--accent2);}
.theader{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.82rem;}
.mini{background:none;border:1px solid var(--line);border-radius:4px;font-size:.65rem;padding:1px 5px;cursor:pointer;color:var(--sub);}
.mini.danger{color:var(--warn);border-color:var(--warn);}
.children{margin:5px 0 4px 22px;display:flex;flex-direction:column;gap:5px;}
.subitem{display:flex;align-items:center;gap:6px;font-size:.78rem;flex-wrap:wrap;}
.draghandle{cursor:grab;color:var(--sub);user-select:none;}
.taskitem.dragover{outline:2px dashed var(--accent2);outline-offset:2px;background:rgba(181,101,29,.06);}
.subitem.dragover-row{outline:2px solid var(--accent2);outline-offset:-2px;}
.addsub{display:flex;gap:4px;margin:5px 0 2px 22px;}
.addsub input{width:170px;}
.addsub button,.addtask button{font-size:.7rem;padding:3px 9px;border-radius:5px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
.addtask{display:flex;gap:6px;}
.addtask input{flex:1;}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 16px;}
.persondetail{grid-column:1/-1;margin-top:0 !important;}
.prow{padding:5px 0;border-bottom:1px dashed var(--line);}
.todogroup{padding:6px 0;border-bottom:1px dashed var(--line);}
.todogroup:last-child{border-bottom:none;}
.todohead{display:flex;align-items:center;gap:6px;font-size:.82rem;margin-bottom:3px;}
.todochips{display:flex;flex-direction:column;gap:4px;margin-top:2px;}
.todoparentgrid{display:flex;gap:12px;overflow-x:auto;margin-top:4px;padding-bottom:4px;}
.todoparentcol{flex:0 0 220px;min-width:200px;}
.todochip{display:flex;align-items:flex-start;gap:5px;font-size:.75rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;}
.todochip span{word-break:break-word;}
.prow:last-child{border-bottom:none;}
.prow-top{display:flex;align-items:center;gap:6px;font-size:.82rem;flex-wrap:wrap;}
.prow-bottom{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--sub);margin-top:3px;}
.pname{font-weight:600;}
.rolelabel{font-weight:400;font-size:.7rem;color:var(--sub);}
.pcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;}
.pcard.staff{border-left-color:var(--accent);}
.pcard.partner{border-left-color:var(--accent2);}
.pcard b{display:block;}
.pcard span{color:var(--sub);font-size:.72rem;}
.hint{color:var(--sub);font-size:.75rem;margin-top:16px;}
.undotoast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--accent2);border-radius:10px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;}
.small{font-size:.7rem;color:var(--sub);}
.chartbars{display:flex;gap:14px;align-items:flex-end;height:90px;margin-top:6px;}
.mtable-row{display:grid;grid-template-columns:110px repeat(7,1fr) 110px;align-items:center;column-gap:6px;}
.chartcol{display:flex;flex-direction:column;align-items:center;flex:1;}
.chartstack{width:100%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;}
.chartbar{width:100%;}
.chartbar.confirmed,.chartbar.paid{background:var(--accent);}
.chartbar.issued{background:#8fb28f;}
.chartbar.estimated,.chartbar.est{background:var(--line);}
.chartbar.expected{background:#cfe0cf;}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px -1px 6px;}
.inboxbox{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.82rem;}
.inboxhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.inboxform{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px;background:rgba(0,0,0,.025);border-radius:8px;}
.inboxform textarea{width:100%;min-height:54px;font-size:.85rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;}
.inboxfields{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
.inboxfields label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;color:var(--sub);}
.inboxcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
@media (max-width:800px){ .inboxcols{grid-template-columns:1fr;} }
.inboxitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;background:var(--card);}
.inboxitem.new{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(181,101,29,.12);}
.inboxitem .meta{font-size:.72rem;color:var(--sub);}
.inboxitem .txt{margin:3px 0;white-space:pre-wrap;}
.inboxitem .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;}
.ibadge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:.7rem;margin-left:4px;}
.ib-sent{background:#f4e3c9;color:#8a4b12;} .ib-ack{background:#dfe9df;color:#2e5d34;} .ib-scheduled{background:#d6e6f0;color:#24506e;} .ib-done{background:#e6e3dc;color:#666;} .ib-wait{background:#ece6f3;color:#5b3f86;}
.ip-urgent{background:#f6d5cf;color:#9b2c1d;} .ip-low{background:#eceae4;color:#6b6b63;}
.lg.outpaid{background:#c0703a;} .lg.outexpected{background:#efcfb4;} .chartbar.outpaid{background:#c0703a;} .chartbar.outexpected{background:#efcfb4;}
.lg.paid{background:var(--accent);} .lg.issued{background:#8fb28f;} .lg.est{background:var(--line);} .lg.expected{background:#cfe0cf;}
.secthead{display:flex;align-items:baseline;gap:10px;font-weight:700;color:var(--accent2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line);font-size:.85rem;}
.secthead .small{font-weight:400;color:var(--sub);}
.calcbox{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;font-weight:600;min-width:90px;}
.slottable{border-collapse:collapse;width:100%;max-width:980px;font-size:.78rem;}
.slottable th{text-align:left;font-weight:600;color:var(--sub);padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
.slottable td{padding:4px 6px;border-bottom:1px dashed var(--line);vertical-align:middle;}
.slottable td:first-child{white-space:nowrap;font-weight:600;}
.slottable input[type=text],.slottable input[type=number]{width:100%;min-width:90px;}
.slottable tr.paidrow td{background:rgba(46,125,50,.07);}
.paidcell{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.paidtag{color:#fff;background:var(--ok);padding:2px 8px;border-radius:10px;font-size:.75rem;}
</style>
</head>
<body class="locked">
<header>
  <h1>三小市集 專案執行儀表板</h1>
  <div class="sub">追蹤每個專案的進度、成本與收款，掌握人力負載與現金流。</div>
  <div class="whoami"></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="restorebanner" role="status"></div>
  <div id="backupnotice" role="status" style="color:var(--warn);"></div>
  <div id="dashboardcontent">
  <div id="inbox"></div>
  <div class="tabs">
    <button data-v="project" class="active">依專案</button>
    <button data-v="person">依人員</button>
  </div>
  <div id="undotoast"></div>
  <div id="synctoast" style="position:fixed;left:14px;bottom:14px;z-index:60;"></div>
  <div id="backbtn" style="position:fixed;top:14px;right:14px;z-index:49;"></div>
  <div id="priority"></div>
  <div id="filterbar" class="filterbar">
    <div id="filters" class="filters"></div>
    <div class="filterdivider"></div>
    <span class="filterlabel">狀態</span>
    <div id="statusfilters" class="filters statusfilters"></div>
    <div class="filterdivider"></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;"><span class="filterlabel">負責人</span><div id="ownerfilters" class="filters" style="align-items:center;flex-wrap:nowrap;"></div></div>
    <input id="searchbox" type="text" placeholder="🔍 搜尋專案名稱…">
  </div>
  <div id="addform" style="margin-bottom:12px;"></div>
  <div id="view"></div>
  </div>
  <div class="hint" id="synchint">正在連線 Google Sheet…</div>
  <button class="mini" data-ui-click="{&quot;action&quot;:&quot;manualRefresh&quot;,&quot;args&quot;:[]}" style="margin-top:6px;">🔄 立即同步</button>
</main>

function fmt(n){ if(n===null||n===undefined||isNaN(n)) return "—"; return "NT$"+Math.round(n).toLocaleString();}

function shortDate(iso){ if(!isISODate(iso)) return ""; const [y,m,d]=iso.split("-"); return (Number(y)!==REF_YEAR?y+"/":"")+`${Number(m)}/${Number(d)}`; }
function mdToISO(md,p){
  if(!md) return '';
  const parts=md.replace(/[^0-9\/]/g,'').split('/');
  if(parts.length===3){
    let y=parseInt(parts[0],10), m=parseInt(parts[1],10), d=parseInt(parts[2],10);
    if(!m||!d||m<1||m>12||d<1||d>31) return '';
    if(!y||y<2000) y=REF_YEAR;
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  if(parts.length!==2) return '';
  const m=parseInt(parts[0],10), d=parseInt(parts[1],10);
  if(!m||!d||m<1||m>12||d<1||d>31) return '';
  // no year given: guess using the project's own start/end year span (handles cross-year projects)
  if(p){
    const range=getRange(p);
    const sy=Number(range.start.split('-')[0]), ey=Number(range.end.split('-')[0]);
    const candidates=sy===ey?[sy]:[sy,ey];
    for(const y of candidates){
      const iso=`${y}-${pad(m)}-${pad(d)}`;
      if(iso>=range.start && iso<=range.end) return iso;
    }
    return `${sy}-${pad(m)}-${pad(d)}`;
  }
  return `${REF_YEAR}-${pad(m)}-${pad(d)}`;
}
// ===== 甘特圖活動日：圓點＋直接顯示文字 =====

function textPx(t){ let w=0; for(const ch of String(t)) w += /[⺀-￿]/.test(ch)?11:6.5; return w+10; }
function eventClusterText(c){
  const d1=c[0].date, d2=c[c.length-1].date;
  let dt=shortDate(d1);
  if(d2!==d1){ const same=d1.slice(0,7)===d2.slice(0,7); dt += '–' + (same ? String(Number(d2.slice(8))) : shortDate(d2)); }
  const labels=[...new Set(c.map(e=>(e.label||'').trim()).filter(Boolean))];
  if(!labels.length) return dt;
  let lab=labels.join('・');
  if(labels.length>1){
    let pre=labels[0]; labels.forEach(l=>{ while(pre && !l.startsWith(pre)) pre=pre.slice(0,-1); });
    const rest=labels.map(l=>l.slice(pre.length));
    if(pre.length>=2 && rest.every(r=>r)) lab=pre+rest.join('/');
  }
  return dt+' '+lab;
}

function eventMarksHtml(events,pctFn,opts){
  const o=opts||{}; const W=o.widthPx||600; const collab=!!o.collab;
  const dotCls=collab?'ganttEventDotCollab':'ganttEventDot';
  const evs=(events||[]).filter(e=>e&&e.date).map(e=>({date:e.date,label:e.label||'',pct:pctFn(e.date)})).sort((a,b)=>a.date.localeCompare(b.date));
  if(!evs.length) return {html:'',extraPx:0};
  const dots=evs.map(e=>`<span class="${dotCls}" style="left:${e.pct}%;" title="活動日${collab?'（協作）':''}：${shortDate(e.date)}${e.label?`　${esc(e.label)}`:''}"></span>`).join('');
  const clusters=[];
  evs.forEach(e=>{ const last=clusters[clusters.length-1]; const px=e.pct/100*W;
    if(last && px-last[last.length-1].pct/100*W<16) last.push(e); else clusters.push([e]); });
  const dotSpans=clusters.map(c=>[c[0].pct/100*W-7, c[c.length-1].pct/100*W+7]);
  const lanes=[]; // lanes[k] = 已佔用的區間
  const overlaps=(a,b)=>a[0]<b[1]+4 && b[0]<a[1]+4;
  let maxLane=0; const labelsHtml=[];
  clusters.forEach((c,ci)=>{
    const text=eventClusterText(c); const w=textPx(text);
    const x0=dotSpans[ci][0], x1=dotSpans[ci][1];
    let right=[x1+2, x1+2+w], anchorLeft=true;
    if(right[1]>W){ right=[x0-2-w, x0-2]; anchorLeft=false; }
    let lane=0;
    for(;;lane++){
      const occ=lanes[lane]||[];
      const blockers = lane===0 ? occ.concat(dotSpans.filter((_,j)=>j!==ci)) : occ;
      if(!blockers.some(b=>overlaps(b,right))) break;
    }
    (lanes[lane]=lanes[lane]||[]).push(right);
    maxLane=Math.max(maxLane,lane);
    const pos = anchorLeft ? `left:calc(${c[c.length-1].pct}% + 9px);` : `left:calc(${c[0].pct}% - 9px);transform:translate(-100%,${lane===0?'-50%':'0'});`;
    const top = lane===0 ? '' : `top:${16+2+(lane-1)*15}px;`;
    labelsHtml.push(`<span class="ganttEventLabel${collab?' collab':''}${lane>0?' lower':''}" style="${pos}${top}">${esc(text)}</span>`);
  });
  return {html:dots+labelsHtml.join(''), extraPx:maxLane*15};
}

// 每個專案的按月金額：mode='rev' 營收認列（預估 → 已開發票 → 已收款），mode='cash' 現金收款（已收款／預計收款）
function projectEntries(p, mode){

  const fm=r.revMonth || Number(getRange(p).end.split('-')[1]);

    inv.forEach(v=>{ if(!isIssued(v)) return; const a=Number(v.amount);

    if(plan){ [9,10,11,12].forEach((m,i)=>{ if(plan[i] && !usedMonth.has(m)) out.push({m,amount:plan[i],kind:'est'}); }); }
    else if(!usedMonth.has(fm) && CHART_MONTHS.includes(fm) && getEstRev(p)) out.push({m:fm,amount:getEstRev(p),kind:'est'});
  } else {
    const remaining=Math.max(0,(getEstRev(p)||0)-issuedSum);
    if(remaining>0 && CHART_MONTHS.includes(fm)) out.push({m:fm,amount:remaining,kind:'est'});

function lagInfo(p){
  const r=getRow(p.id);
  if(r.status==="已完成") return {overdue:false, lag:0, done:true};
  const range=getRange(p);
  const start=new Date(range.start+"T00:00:00"), end=new Date(range.end+"T23:59:59");
  const now=new Date();
  const overdue = now>end;
  const totalMs=end-start;
  let lag=0;
  if(totalMs>0){
    const elapsed=Math.min(Math.max(now-start,0), totalMs);
    const timeRatio=elapsed/totalMs;
    const tp=taskProgress(p); const taskRatio=tp.total?tp.done/tp.total:0;
    lag=timeRatio-taskRatio;
  }
  return {overdue, lag, done:false};
}

function quarterCost(){
  let q4Cost=0, q1Cost=0;
  FINP().forEach(p=>{
    const pr=getRow(p.id); const cost=(pr.cost===null||pr.cost==="")?0:Number(pr.cost); if(!cost) return;
    const es=projectEntries(p,'rev'); const tot=es.reduce((s2,e)=>s2+e.amount,0);
    if(tot>0){ q4Cost+=cost*es.filter(e=>e.m>=9).reduce((s2,e)=>s2+e.amount,0)/tot; q1Cost+=cost*es.filter(e=>e.m<=3).reduce((s2,e)=>s2+e.amount,0)/tot; }
    else { const fm=pr.revMonth || Number(getRange(p).end.split('-')[1]); if(fm>=9) q4Cost+=cost; else if(fm<=3) q1Cost+=cost; }
  });
  return {q4Cost, q1Cost};
}

function ganttRows(p){
  const rows=[];
  taskList(p).forEach((t)=>{
    const subs=materializedSubs(p.id,t);
    if(subs.length){
      subs.forEach(s=>{ rows.push({group:t, label:s.name, start:s.start, end:s.end, assignee:s.assignee, done:s.done, audience:s.audience}); });
    } else {
      const info=taskInfo(p,t);
      rows.push({group:null, label:t, start:info.start, end:info.end, assignee:info.assignee, done:info.done});
    }
  });
  return rows;
}
function ganttHtml(p){
  const rows=ganttRows(p);
  const dated=rows.filter(r=>r.start&&r.end);
  const undated=rows.filter(r=>!r.start||!r.end);
  if(!dated.length){
    const undatedHtml0=undated.length?`<div class="small" style="margin-top:6px;">尚未標日期：${undated.map(r=>esc(r.label)).join('、')}（在下面任務清單填開始/截止日就會出現在圖上）</div>`:'';
    return `<div class="gantt"><div class="small">目前沒有任何任務標了開始/截止日，先在下面任務清單裡加就會自動畫出來。</div>${undatedHtml0}</div>`;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const proj=getRange(p);
  const rangeStart=new Date(proj.start+"T00:00:00");
  const rangeEnd=new Date(proj.end+"T00:00:00");
  const totalMs=(rangeEnd-rangeStart)||1;
  const totalDays=Math.max(1,Math.round(totalMs/86400000));
  const todayPct=(today>=rangeStart && today<=rangeEnd) ? ((today-rangeStart)/totalMs*100) : null;
  const outOfRange=dated.filter(r=>r.start<proj.start || r.end>proj.end);
  const gridLines=[]; const weekLabels=[];
  for(let d=0; d<=totalDays; d+=7){
    gridLines.push(d/totalDays*100);
    if(d<totalDays){
      const wd=new Date(rangeStart); wd.setDate(wd.getDate()+d);
      const wom=Math.ceil(wd.getDate()/7);
      weekLabels.push({pct:d/totalDays*100, label:`${wd.getMonth()+1}月W${wom}`});
    }
  }
  let overlayHtml=gridLines.map(pct=>`<div class="ganttgrid" style="left:${pct}%;"></div>`).join('')
    + (todayPct!==null?`<div class="ganttToday" style="left:${todayPct}%;"></div>`:'');
  const pct=(iso)=>{ const d=new Date(iso+"T00:00:00"); const c=d<rangeStart?rangeStart:(d>rangeEnd?rangeEnd:d); return (c-rangeStart)/totalMs*100; };
  const dayCount=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)+1;
  const prForEvent=getRow(p.id);
  const evMarks=eventMarksHtml(prForEvent.eventDates,pct,{widthPx:measuredWidth('#view .ganttbararea',Math.max(500,Math.round(totalDays*8))-258)});
  const eventDotsHtml=evMarks.html;
  (prForEvent.eventDates||[]).forEach(e=>{ overlayHtml += `<div class="ganttEventLine" style="left:${pct(e.date)}%;"></div>`; });

  // pre-compute each group's min/max span
  const groupSpan={};
  dated.forEach(r=>{ if(!r.group) return; if(!groupSpan[r.group]) groupSpan[r.group]={min:r.end,max:r.end}; if(r.end<groupSpan[r.group].min) groupSpan[r.group].min=r.end; if(r.end>groupSpan[r.group].max) groupSpan[r.group].max=r.end; });

  let lastGroup=undefined;
  let curGroupExpanded=true;
  const barsHtml=dated.map(r=>{
    const isPoint=r.start===r.end;
    const leftPct=pct(r.start);
    const widthPct=isPoint?0:Math.max(2,pct(r.end)-pct(r.start));
    const cls=r.assignee?(isStaff(r.assignee)?'ganttbar-staff':isVendor(r.assignee)?'ganttbar-vendor':'ganttbar-partner'):'ganttbar-none';
    const dateLabel=isPoint?shortDate(r.start):`${shortDate(r.start)}–${shortDate(r.end)}`;
    const markerHtml=isPoint
      ? `<div class="ganttmilestone ${cls} ${r.done?'ganttbar-done':''}" style="left:${leftPct}%;" title="${dateLabel}${r.done?'（已完成）':''}"></div>`
      : `<div class="ganttbar ${cls} ${r.done?'ganttbar-done':''}" style="left:${leftPct}%;width:${widthPct}%;" title="${dateLabel}${r.done?'（已完成）':''}"></div>`;
    const dateTag=`<span class="ganttdate" style="left:calc(${leftPct}% + ${widthPct}% + 8px);">${dateLabel}</span>`;
    let groupHeader='';
    if(r.group!==lastGroup){
      lastGroup=r.group;
      if(r.group){
        const key=p.id+'::'+r.group;
        curGroupExpanded=!!ganttGroupExpanded[key];
        const sp=groupSpan[r.group];
        const gLeft=pct(sp.min), gWidth=Math.max(4,pct(sp.max)-pct(sp.min));
        const gLabel=sp.min===sp.max?shortDate(sp.min):`${shortDate(sp.min)}–${shortDate(sp.max)}`;
        const gDays=dayCount(sp.min,sp.max);
        groupHeader=`<div class="ganttrow ganttgrouprow" ${uiEvent('click','toggleGanttGroup',[String(p.id),jsStr(r.group)])} style="cursor:pointer;">
          <div class="ganttlabel"><span class="arrow">${curGroupExpanded?'▾':'▸'}</span><b>${esc(r.group)}</b></div>
          <div class="ganttbararea">${overlayHtml}<div class="ganttbar ganttbar-group" style="left:${gLeft}%;width:${gWidth}%;"></div><span class="ganttdate" style="left:calc(${gLeft}% + ${gWidth}% + 8px);">${gLabel}（共${gDays}天）</span></div>
        </div>`;
      } else { curGroupExpanded=true; }
    }
    if(r.group && !curGroupExpanded) return groupHeader;
    const labelText = r.group ? `　└ ${esc(r.label)}` : esc(r.label);
    const audDot = audienceBadge(r.audience);
    return `${groupHeader}<div class="ganttrow ${r.group?'ganttchildrow':''}">
      <div class="ganttlabel" style="display:flex;align-items:center;gap:3px;white-space:nowrap;">${audDot}<span>${labelText}</span>${r.assignee?`<span class="small" style="color:var(--sub);">・${esc(r.assignee)}</span>`:''}</div>
      <div class="ganttbararea">${overlayHtml}${markerHtml}${dateTag}</div>
    </div>`;
  }).join('');
  const undatedHtml=undated.length?`<div class="small" style="margin-top:6px;">尚未標日期：${undated.map(r=>esc(r.label)).join('、')}（在下面任務清單填開始/截止日就會出現在圖上）</div>`:'';
  const outOfRangeHtml=outOfRange.length?`<div class="small" style="margin-top:6px;color:var(--warn);">⚠ 以下任務超出專案起訖範圍（${shortDate(proj.start)}–${shortDate(proj.end)}），圖上會裁切在邊界，建議修改任務日期或調整專案起訖日：${outOfRange.map(r=>`${esc(r.label)}（${shortDate(r.start)===shortDate(r.end)?shortDate(r.start):shortDate(r.start)+'–'+shortDate(r.end)}）`).join('、')}</div>`:'';
  const weekHeaderHtml=`<div class="ganttrow ganttweekrow">
    <div class="ganttlabel"></div>
    <div class="ganttbararea">${weekLabels.map(w=>`<span class="ganttweeklabel" style="left:${w.pct}%;">${w.label}</span>`).join('')}</div>
  </div>`;
  const eventRowHtml=eventDotsHtml?`<div class="ganttrow" style="min-height:16px;${evMarks.extraPx?'align-items:flex-start;':''}">
    <div class="ganttlabel small">活動日</div>
    <div class="ganttbararea" style="${evMarks.extraPx?`margin-bottom:${evMarks.extraPx}px;`:''}">${eventDotsHtml}</div>
  </div>`:'';
  const minWidthPx=Math.max(500, Math.round(totalDays*8));
  const body=`<div class="small" style="margin-bottom:2px;">起訖：${shortDate(proj.start)}–${shortDate(proj.end)}</div>
    <div class="ganttscroll"><div class="ganttinner" style="min-width:${minWidthPx}px;">
       <div class="gantthead">
         ${weekHeaderHtml}
         ${eventRowHtml}
       </div>
       <div class="ganttbody">${barsHtml}</div>
       </div></div>`;
  return `<div class="gantt">${body}${undatedHtml}${outOfRangeHtml}</div>`;
}

function capacityOverviewHtml(){
  const today=new Date(); today.setHours(0,0,0,0);
  const isActive=p=>{ const r=getRange(p); return today>=new Date(r.start+"T00:00:00") && today<=new Date(r.end+"T23:59:59"); };
  const names=[...TEAM_STAFF, ...TEAM_PARTNER].filter((n,i,arr)=>arr.indexOf(n)===i);
  const groups=names.map(name=>{
    const owned=ALLP.filter(p=>getRow(p.id).status!=="已完成" && getRow(p.id).assignee===name);
    const collab=ALLP.filter(p=>getRow(p.id).status!=="已完成" && getRow(p.id).assignee!==name && collaboratorsOf(p).includes(name));
    if(!owned.length && !collab.length) return null;
    const activeNow=owned.filter(isActive);
    const activeCollab=collab.filter(isActive);
    return {name, owned, collab, activeNow, activeCollab};
  }).filter(Boolean);
  if(!groups.length) return `<div class="small">目前沒有人負責或協作中的專案</div>`;
  groups.sort((a,b)=>(b.activeNow.length+b.activeCollab.length)-(a.activeNow.length+a.activeCollab.length));
  const customOrder=state._personOrder||[];
  const ordered=customOrder.map(n=>groups.find(g=>g.name===n)).filter(Boolean)
    .concat(groups.filter(g=>!customOrder.includes(g.name)));
  lastCapacityOrder=ordered.map(g=>g.name);

  let minStart=null, maxEnd=null;
  ordered.forEach(g=>g.owned.concat(g.collab).forEach(p=>{ const r=getRange(p); if(!minStart||r.start<minStart) minStart=r.start; if(!maxEnd||r.end>maxEnd) maxEnd=r.end; }));
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  const monthStartStr=`${monthStart.getFullYear()}-${pad(monthStart.getMonth()+1)}-01`;
  if(!minStart || minStart<monthStartStr) minStart=monthStartStr;
  const rangeStart=new Date(minStart+"T00:00:00"), rangeEnd=new Date(maxEnd+"T00:00:00");
  const totalMs=(rangeEnd-rangeStart)||1;
  const totalDays=Math.max(1,Math.round(totalMs/86400000));
  const pctOf=d=>{ const dt=new Date(d+"T00:00:00"); return Math.max(0,Math.min(100,(dt-rangeStart)/totalMs*100)); };
  const today0=new Date(); today0.setHours(0,0,0,0);
  const todayPct=(today0>=rangeStart&&today0<=rangeEnd)?((today0-rangeStart)/totalMs*100):null;
  const gridLines=[]; const weekLabels=[];
  for(let d=0; d<=totalDays; d+=7){
    gridLines.push(d/totalDays*100);
    if(d<totalDays){ const wd=new Date(rangeStart); wd.setDate(wd.getDate()+d); const wom=Math.ceil(wd.getDate()/7); weekLabels.push({pct:d/totalDays*100, label:`${wd.getMonth()+1}月W${wom}`}); }
  }
  const overlayHtml=gridLines.map(pc=>`<div class="ganttgrid" style="left:${pc}%;"></div>`).join('') + (todayPct!==null?`<div class="ganttToday" style="left:${todayPct}%;"></div>`:'');
  const LBL="width:200px;";
  const capMinWidthPx=Math.max(560, Math.round(totalDays*8));
  const capW=measuredWidth('#priority .ganttbararea', capMinWidthPx-208);

  const rowsHtml=ordered.map((g,gi)=>{
    const totalActive=g.activeNow.length+g.activeCollab.length;
    const severityBg = totalActive===0?'rgba(46,125,50,.08)' : totalActive>=3?'rgba(192,57,43,.10)' : 'rgba(181,101,29,.08)';
    const isOpen=capacityExpanded.has(g.name);
    const moveBtns=`<button class="mini" ${uiEvent('click','moveCapacityPerson',[jsStr(g.name),-1],null,true)}>▲</button><button class="mini" ${uiEvent('click','moveCapacityPerson',[jsStr(g.name),1],null,true)}>▼</button>`;
    const header=`<div class="ganttrow" ${uiEvent('click','toggleCapacityGroup',[jsStr(g.name)])} style="cursor:pointer;background:${severityBg};">
      <div class="ganttlabel" style="${LBL}display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap;"><span class="arrow">${isOpen?'▾':'▸'}</span><b ${uiEvent('click','goToPersonCard',[jsStr(g.name)],null,true)} title="同時${totalActive}案：負責${g.activeNow.length}・協作${g.activeCollab.length}" style="text-decoration:underline;text-decoration-style:dotted;">${esc(g.name)}</b>${moveBtns}</div>
      <div class="ganttbararea">${overlayHtml}</div>
    </div>`;
    if(!isOpen) return header;
    const ownRows=g.owned.slice().sort((a,b)=>getRange(a).start.localeCompare(getRange(b).start)).map(p=>{
      const r=getRange(p);
      const li=lagInfo(p);
      const cls = li.done?'ownbar-done' : li.overdue?'ownbar-overdue' : li.lag>=0.2?'ownbar-lag':'ownbar-normal';
      const left=pctOf(r.start), width=Math.max(2,pctOf(r.end)-pctOf(r.start));
      const evRow=getRow(p.id);
      const evM=eventMarksHtml(evRow.eventDates,pctOf,{widthPx:capW});
      return `<div class="ganttrow" ${uiEvent('click','goToProject',[String(p.id)])} style="cursor:pointer;${evM.extraPx?'align-items:flex-start;':''}">
        <div class="ganttlabel" style="${LBL}overflow:hidden;white-space:nowrap;">　└ <span class="cat" style="font-size:.62rem;padding:1px 4px;">${esc(p.cat)}</span> ${esc(getName(p))}</div>
        <div class="ganttbararea" style="${evM.extraPx?`margin-bottom:${evM.extraPx}px;`:''}">${overlayHtml}<div class="ganttbar ${cls}" style="left:${left}%;width:${width}%;" title="${shortDate(r.start)}–${shortDate(r.end)}"></div>${evM.html}</div>
      </div>`;
    }).join('');
    const collabRows=g.collab.slice().sort((a,b)=>getRange(a).start.localeCompare(getRange(b).start)).map(p=>{
      const r=getRange(p);
      const li=lagInfo(p);
      const cls = li.done?'ownbar-done' : li.overdue?'ownbar-overdue' : li.lag>=0.2?'ownbar-lag':'ownbar-normal';
      const left=pctOf(r.start), width=Math.max(2,pctOf(r.end)-pctOf(r.start));
      const rr=getRow(p.id);
      const evM=eventMarksHtml(rr.eventDates,pctOf,{widthPx:capW,collab:true});
      return `<div class="ganttrow" ${uiEvent('click','goToProject',[String(p.id)])} style="cursor:pointer;${evM.extraPx?'align-items:flex-start;':''}">
        <div class="ganttlabel" style="${LBL}overflow:hidden;white-space:nowrap;" title="協作・負責:${esc(rr.assignee||'未指派')}">　└ <span class="cat" style="font-size:.62rem;padding:1px 4px;">${esc(p.cat)}</span> ${esc(getName(p))}</div>
        <div class="ganttbararea" style="${evM.extraPx?`margin-bottom:${evM.extraPx}px;`:''}">${overlayHtml}<div class="ganttbar collabbar ${cls}" style="left:${left}%;width:${width}%;" title="協作・${shortDate(r.start)}–${shortDate(r.end)}"></div>${evM.html}</div>
      </div>`;
    }).join('');
    return header+ownRows+collabRows;
  }).join('');

  const weekHeaderHtml=`<div class="ganttrow ganttweekrow"><div class="ganttlabel" style="${LBL}"></div><div class="ganttbararea">${weekLabels.map(w=>`<span class="ganttweeklabel" style="left:${w.pct}%;">${w.label}</span>`).join('')}</div></div>`;
  const minWidthPx=Math.max(560, Math.round(totalDays*8));
  const legend=`<div class="small" style="margin-bottom:4px;">顏色：<span style="color:#8fb28f;">●</span>正常　<span style="color:#d3a86a;">●</span>落後　<span style="color:var(--warn);">●</span>逾期　<span style="color:var(--line);">●</span>完成　｜　實心橫桿＝負責，虛線淺色＝協作　｜　活動日：<span style="color:#2c5f7c;">●</span>負責　<span style="color:#9b7cb6;">●</span>協作</div>`;
  return `${legend}<div class="small" style="margin-bottom:2px;">起訖：${shortDate(minStart)}–${shortDate(maxEnd)}</div>
    <div class="gantt"><div class="ganttscroll"><div class="ganttinner" style="min-width:${minWidthPx}px;">
    <div class="gantthead">${weekHeaderHtml}</div>
    <div class="ganttbody">${rowsHtml}</div>
  </div></div></div>`;
}
function personMonthlyHtml(t){
  const items=[];
  ALLP.forEach(p=>{
    taskList(p).forEach(tn=>{
      const subs=materializedSubs(p.id,tn);
      const pushIt=(name,info)=>{ if(info.assignee===t && info.end){ items.push({ym:info.end.slice(0,7), date:info.end, proj:getName(p), task:name, done:info.done}); } };
      if(subs.length){ subs.forEach(s=>pushIt(s.name,s)); }
      else { pushIt(tn, taskInfo(p,tn)); }
    });
  });
  const today=new Date(); const todayYm=`${today.getFullYear()}-${pad(today.getMonth()+1)}`;
  if(!items.length) return `<div class="small">目前沒有標日期的任務</div>`;
  let yms=[...new Set(items.map(i=>i.ym).concat([todayYm]))].sort();
  const cols=yms.map(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const label=(y!==REF_YEAR?y+'/':'')+m+'月';
    const rows=items.filter(i=>i.ym===ym).sort((a,b)=>a.date.localeCompare(b.date));
    const body=rows.length? rows.map(it=>`<div class="monthitem${it.done?' done':''}">${shortDate(it.date)} <span class="monthproj">${esc(it.proj)}</span>：${esc(it.task)}</div>`).join('') : '<div class="small">（無）</div>';
    return `<div class="monthcol"><div class="monthcolhead">${label}</div>${body}</div>`;
  }).join('');
  return `<div class="monthgridscroll"><div class="monthgrid">${cols}</div></div>`;
}
function personDetailHtml(t){
  const owned=ALLP.filter(p=>getRow(p.id).assignee===t)
    .sort((a,b)=>URG_RANK[urgency(a)]-URG_RANK[urgency(b)] || new Date(getRange(a).end)-new Date(getRange(b).end));
  const collab=ALLP.filter(p=>collaboratorsOf(p).includes(t) && getRow(p.id).assignee!==t)
    .sort((a,b)=>URG_RANK[urgency(a)]-URG_RANK[urgency(b)] || new Date(getRange(a).end)-new Date(getRange(b).end));
  let myTasks=[];
  ALLP.forEach(p=>{
    taskList(p).forEach((tn,idx)=>{
      const subs=materializedSubs(p.id,tn);
      if(subs.length){ subs.forEach((s,si)=>{ if(s.assignee===t) myTasks.push({p,idx,si,parent:tn,name:s.name,done:s.done}); }); }
      else { const info=taskInfo(p,tn); if(info.assignee===t) myTasks.push({p,idx,si:null,parent:null,name:tn,done:info.done}); }
    });
  });
  const ownedHtml=owned.map(p=>projRowHtml(p)).join("")||'<div class="prow small">（無）</div>';
  const collabHtml=collab.map(p=>projRowHtml(p)).join("")||'<div class="prow small">（無）</div>';

  // 我的待辦：只列還沒做完的，依專案分組，專案名稱不重複
  const pending=myTasks.filter(x=>!x.done);
  const byProject=new Map();
  pending.forEach(x=>{ const k=x.p.id; if(!byProject.has(k)) byProject.set(k,[]); byProject.get(k).push(x); });
  const projIds=[...byProject.keys()].sort((a,b)=>{
    const pa=getProject(a), pb=getProject(b);
    return URG_RANK[urgency(pa)]-URG_RANK[urgency(pb)] || new Date(getRange(pa).end)-new Date(getRange(pb).end);
  });
  const TODO_LIMIT=3;
  const todoIsExpanded=todoExpandedSet.has(t);
  const shownIds = todoIsExpanded ? projIds : projIds.slice(0,TODO_LIMIT);
  const todoHtml = shownIds.length ? shownIds.map(pid=>{
    const p=getProject(pid); const items=byProject.get(pid);
    const byParent=new Map();
    items.forEach(x=>{ const k=x.parent||'__leaf__'; if(!byParent.has(k)) byParent.set(k,[]); byParent.get(k).push(x); });
    const groupsHtml=[...byParent.entries()].map(([parent,arr])=>{
      const lines=arr.map(x=>{
        const cb=x.si===null
          ? `<input type="checkbox" ${uiEvent('change','toggleTask',[String(x.p.id),x.idx],'checked')}>`
          : `<input type="checkbox" ${uiEvent('change','toggleSubtask',[String(x.p.id),x.idx,x.si],'checked')}>`;
        return `<label class="todochip">${cb}<span>${esc(x.name)}</span></label>`;
      }).join("");
      const parentLabel = parent!=='__leaf__' ? `<div class="small" style="font-weight:600;margin-bottom:2px;">${esc(parent)}</div>` : '';
      return `<div class="todoparentcol">${parentLabel}<div class="todochips">${lines}</div></div>`;
    }).join("");
    return `<div class="todogroup">
      <div class="todohead"><span class="pname">${esc(getName(p))}</span><span class="cat">${esc(p.cat)}</span><span class="badge ${urgency(p)}">${URG_LABEL[urgency(p)]}</span></div>
      <div class="todoparentgrid">${groupsHtml}</div>
    </div>`;
  }).join("") : `<div class="prow small">🎉 目前沒有待辦任務</div>`;
  const moreBtn = projIds.length>TODO_LIMIT

// 資安：localStorage 不存任何資料或密碼（舊版留下的一併清掉）。
// 尚未同步的草稿只放在「這個分頁」的 sessionStorage：關掉分頁或確認登出就清除，
// 重新整理後要先通過伺服器驗證、而且是同一個人同一個權限，才會提供復原。
try{ ['dash_backup_v2','dash_backup_v3','dash_code','dash_whoami'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
const DRAFT_KEY='dash_draft_v4';
const DRAFT_FINANCE_FIELDS=['estOverride','actual','cost','receipts','estPlan','revMonth','invoiceMonth',
  'paymentMethod','installmentCount','invoices','relatedParty','costLink','expenses'];
let backupFailed=false, recoveryBusy=false, activeWrite=null;
function backupWarning(message){
  backupFailed=!!message;
  const el=document.getElementById('backupnotice'); if(el) el.textContent=message||'';
}
function writeBackup(backup){
  try{
    if(backup) sessionStorage.setItem(DRAFT_KEY,JSON.stringify(backup));
    else sessionStorage.removeItem(DRAFT_KEY);
    backupWarning(''); return true;
  }catch(e){
    backupWarning(backup ? '⚠ 分頁暫存失敗。最新未同步修改只留在目前畫面，請勿重新整理或關閉分頁。'
      : '⚠ 雲端已確認目前資料，但舊的分頁暫存未能清除；下次復原前請核對內容。');
    return false;
  }
}
function makeBackup(uncertain=false){
  return {version:4,owner:ME.name,level:ME.level,base:clone(lastSynced),state:clone(state),savedAt:Date.now(),uncertain};
}
function localBackupSave(){
  if(!isAuthenticated()||window._pendingBackup) return false;
  if(activeWrite && isCurrent(activeWrite.ctx)){
    return writeBackup({...makeBackup(true),base:clone(activeWrite.base),sent:clone(activeWrite.sent)});
  }
  return writeBackup(same(normState(state),normState(lastSynced)) ? null : makeBackup());
}
// 復原時以「最新伺服器資料」的負責人與目前角色判斷財務權限，不用草稿裡的舊負責人。
function projectDraft(source,remote){
  const out=clone(source);
  const allowed=id=>isFinAll() || (ME.level==='owner' && !!remote[id] && remote[id].assignee===ME.name);
  Object.keys(out).forEach(id=>{
    if(id[0]==='_'||!isObj(out[id])) return;
    if(!allowed(id)) DRAFT_FINANCE_FIELDS.forEach(f=>delete out[id][f]);
    if(!canEditAssignee()) out[id].assignee=(remote[id]&&remote[id].assignee)||'';
  });
  // 營收基準在網頁上是唯讀的，一律用伺服器目前允許你看的版本。
  delete out._fin;
  if(isObj(remote._fin)) out._fin=clone(remote._fin);
  if(Array.isArray(out._customProjects)) out._customProjects.forEach(p=>{ if(isObj(p)&&!allowed(p.id)) delete p.rev; });
  return out;
}
function scopeBackup(b,remote){
  return {...b,state:projectDraft(b.state,remote),...(isObj(b.base)?{base:projectDraft(b.base,remote)}:{}),
    ...(isObj(b.sent)?{sent:projectDraft(b.sent,remote)}:{})};
}
function localBackupLoad(){
  if(!isAuthenticated()) return null;
  try{
    const b=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'null');
    if(!b) return null;
    if(b.owner!==ME.name||b.level!==ME.level){ writeBackup(null); return null; }
    if(!isObj(b.state)) throw new Error('invalid_backup');
    return scopeBackup(b,state);
  }catch(e){
    backupWarning('⚠ 無法讀取分頁暫存，請保留此分頁並聯絡管理者。'); return {unread:true};
  }
}
function clearRestoreBanner(){
  window._pendingBackup=null;
  document.getElementById('restorebanner').innerHTML='';
  document.getElementById('dashboardcontent').inert=false;

function showRestoreBanner(backup){
  if(!isAuthenticated()) return;

  document.getElementById('dashboardcontent').inert=true;
  const supported=backup.version===4 && isObj(backup.base);
  const description=backup.unread ? '無法讀取分頁暫存，已暫停編輯以免覆蓋尚未讀取的草稿。可重新整理重試，或保留此分頁並聯絡管理者。'
    : !supported ? '這份暫存沒有同步基準，無法安全自動合併。請保留此分頁並聯絡管理者，或確認放棄暫存。'
    : backup.uncertain ? '上次寫入的結果尚未確認，伺服器可能已經儲存。已暫停自動重送；請核對後選擇復原或放棄草稿。'
    : '畫面顯示的是雲端資料。復原會先重新讀取最新資料，再合併草稿；處理完成前暫停編輯。';
  document.getElementById('restorebanner').innerHTML=`<div class="priority" style="margin-bottom:14px;">

    ${supported?'<div class="small">不同欄位的修改會合併；同一欄位兩邊都改過時，依下方選擇決定。復原後會同步給其他人。只復原目前權限允許的內容。</div>':''}
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      ${supported?`<button class="mini" ${uiEvent('click','restoreBackup',['theirs'])}>復原草稿，衝突時保留雲端</button>
      <button class="mini" ${uiEvent('click','restoreBackup',['mine'])}>復原草稿，衝突時採用草稿</button>`:''}
      <button class="mini" ${uiEvent('click','ignoreBackup',[])}>放棄草稿，使用雲端資料</button>
    </div></div>`;
}
window.restoreBackup=async function(tie='theirs'){
  if(!isAuthenticated()||recoveryBusy||!window._pendingBackup||!['mine','theirs'].includes(tie)) return;
  const pending=window._pendingBackup;
  if(pending.version!==4||!isObj(pending.base)) return;
  if(pending.uncertain && !confirm('上次寫入可能已經在伺服器完成，取消連線不能撤回它。要讀取最新資料並依選擇合併草稿嗎？')) return;
  const ctx=authContext(); recoveryBusy=true;
  try{
    const remote=await fetchRemote(ctx);
    assertCurrent(ctx);
    if(window._pendingBackup!==pending) return;
    if(looksWiped(remote)) throw new Error('remote looks wiped');
    const b=scopeBackup(pending,remote);
    // 先處理「已送出但結果未知」的那次寫入，再合併等待期間的新修改。
    const reconciled=b.uncertain && isObj(b.sent)
      ? mergeState(b.sent,b.state,mergeState(b.base,b.sent,remote,tie),tie)
      : mergeState(b.base,b.state,remote,tie);
    state=projectDraft(reconciled,remote); lastSynced=clone(remote);
    clearRestoreBanner(); localBackupSave(); render();
    await persist();
    if(isCurrent(ctx)&&isAuthenticated()&&!window._pendingBackup) setSyncStatus(same(state,lastSynced)?'ok':'fail');
  }catch(e){
    console.error(e);
    if(isCurrent(ctx)&&isAuthenticated()) setHint('⚠ 尚未完成草稿復原，草稿仍保留。請確認連線與雲端資料後重試。',true);
  }finally{ recoveryBusy=false; }
};
window.ignoreBackup=function(){
  if(!isAuthenticated()||recoveryBusy||!window._pendingBackup) return;
  if(!confirm('確定放棄這個分頁的草稿？未送出的修改將無法復原；已送到伺服器的寫入無法撤回。')) return;
  if(!writeBackup(null)) return; // 清不掉就不要宣稱草稿已經移除
  state=clone(lastSynced); clearRestoreBanner(); render(); setSyncStatus('ok');
};
// 讀到雲端資料後決定要不要提示草稿（雲端是否已有資料都會提示）。
function offerDraftIfAny(){
  const backup=localBackupLoad();
  if(backup && backup.unread){ showRestoreBanner(backup); return; }
  if(!backup) return;
  const differs=!same(normState(backup.state),normState(state));
  const hasEdits=!(backup.version===4 && isObj(backup.base)) || !same(normState(backup.base),normState(backup.state));
  if(backup.uncertain || (differs && hasEdits)){ writeBackup(backup); showRestoreBanner(backup); }
  else writeBackup(null);
}

let oldBackend=false;
function setHint(msg,isWarn){
  if(oldBackend){ msg='⚠ 後端 Apps Script 還是舊版，為了保護資料，這個頁面暫停讀寫。請先部署新版 Apps Script。'; isWarn=true; }

// ================= 財務權限 =================
// 權限由 Google Apps Script 判斷；沒權限的數字根本不會傳到這台電腦。這裡只負責「畫面要不要顯示」。
let ME=null;            // {name, level:'admin'|'finance'|'owner'|'none'}，沒登入是 null
let loginError=null;
// 密碼只在登入那一次送出，不存任何地方。登入後拿到一張「通行證」（6 小時後失效），只放在這個分頁，關掉分頁就沒了。
let authToken=(()=>{ try{ return sessionStorage.getItem('dash_token')||''; }catch(e){ return ''; } })();
function setToken(t){ authToken=t||''; try{ if(authToken) sessionStorage.setItem('dash_token',authToken); else sessionStorage.removeItem('dash_token'); }catch(e){} }
// 每次登入／登出／通行證失效都換一個「世代」；舊世代送出的請求即使晚到也不能改畫面。
let authGeneration=0;
function authContext(){ return {generation:authGeneration,token:authToken}; }
function isCurrent(ctx){ return !!ctx && ctx.generation===authGeneration && ctx.token===authToken; }
function assertCurrent(ctx){ if(!isCurrent(ctx)) throw new Error('stale_session'); }
function isAuthenticated(){ return !!ME && !!authToken; }
const REQUEST_TIMEOUT_MS=30000;
const activeRequests=new Set();
// 每個請求最多等 30 秒（包含讀取與解析回應內容）；登出時一併取消。
async function requestJson(url,init,ctx){
  if(ctx) assertCurrent(ctx);
  const controller=new AbortController();
  let rejectInterrupted;
  const interrupted=new Promise((resolve,reject)=>{ rejectInterrupted=reject; });
  const stop=reason=>{ rejectInterrupted(new Error(reason)); controller.abort(); };
  const request={cancel:()=>stop('stale_session')};
  activeRequests.add(request);
  const timer=setTimeout(()=>stop('request_timeout'),REQUEST_TIMEOUT_MS);
  try{
    const response=(async()=>{
      const res=await fetch(url,{...init,signal:controller.signal});
      if(!res.ok) throw new Error('http_error');
      return await res.json();
    })();
    response.catch(()=>{});
    const data=await Promise.race([response,interrupted]);
    if(ctx) assertCurrent(ctx);
    return data;
  }finally{ clearTimeout(timer); activeRequests.delete(request); }
}
async function apiPost(body,ctx){
  return requestJson(SHEET_API_URL,{method:"POST",cache:"no-store",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)},ctx);
}

  ME=null; state={}; lastSynced={}; applyConfig(null); setToken('');
  expanded=new Set(); document.body.classList.add('locked'); renderLogin();
}

window.login=async function(){

};
async function reloadAfterAuthChange(){

// ================= 自動同步（輪詢 + 三方合併）=================
// 概念：lastSynced = 上次跟 Google Sheet 對齊時的版本（合併基準）。
// 存檔時先抓雲端最新版，只把「我這台改過的欄位」疊上去再寫回，避免把同事剛存的東西蓋掉。
// 每 15 秒（分頁在前景時）自動抓一次雲端版本，合併後重繪；使用者正在打字時延後重繪。
const POLL_MS=15000;
let lastSynced={};
let saveChain=Promise.resolve(), savingCount=0, pollBusy=false;
let pendingRemoteRender=false, dragActive=false, lastTypingAt=0, lastSyncAt=null;

// ===== 合併核心（網頁與 Apps Script 共用同一份，修改時兩邊要一起更新）=====
function clone(o){ return o===undefined?undefined:JSON.parse(JSON.stringify(o)); }
function stableStr(v){
  if(v===undefined) return 'undefined';
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStr).join(',')+']';
  return '{'+Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort().map(function(k){return JSON.stringify(k)+':'+stableStr(v[k]);}).join(',')+'}';
}
function same(a,b){ return stableStr(a)===stableStr(b); }
function isObj(v){ return v!==null && typeof v==='object' && !Array.isArray(v); }
function idArr(a){ return Array.isArray(a) && a.every(function(x){return isObj(x)&&x.id!=null;}); }
function primArr(a){ return Array.isArray(a) && a.every(function(x){return x===null||typeof x!=='object';}); }
// b=基準、m=我這台、t=雲端。誰有改就用誰的；兩邊都改同一格時預設以「我這台」為準（tie='theirs' 則以雲端為準）。
function merge3(b,m,t,tie){
  if(same(m,b)) return clone(t);
  if(same(t,b)) return clone(m);
  if(same(m,t)) return clone(m);
  if(isObj(m)&&isObj(t)){
    const bb=isObj(b)?b:{}; const out={};
    const keys={}; [bb,m,t].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k]=1; }); });
    Object.keys(keys).forEach(function(k){ const v=merge3(bb[k],m[k],t[k],tie); if(v!==undefined) out[k]=v; });
    return out;
  }
  if(Array.isArray(m)&&Array.isArray(t)){
    const bb=Array.isArray(b)?b:[];
    // 有 id 的清單（子項目、自訂專案）：逐項合併，兩人同時新增／各改各的都會保留
    if(idArr(m)&&idArr(t)&&idArr(bb)){
      const bm={}, mm={}, tm={};
      bb.forEach(function(x){ bm[x.id]=x; }); m.forEach(function(x){ mm[x.id]=x; }); t.forEach(function(x){ tm[x.id]=x; });
      const order=m.map(function(x){return x.id;});
      t.forEach(function(x){ if(!(x.id in mm)) order.push(x.id); });
      const out=[]; const seen={};
      order.forEach(function(id){ if(seen[id]) return; seen[id]=1; const v=merge3(bm[id],mm[id],tm[id],tie); if(v!==undefined) out.push(v); });
      return out;
    }
    // 文字清單（任務排序、自訂任務名稱…）：新增的都留，刪除的都刪
    if(primArr(m)&&primArr(t)&&primArr(bb)){
      const tDel=bb.filter(function(x){ return t.indexOf(x)<0; });
      const out=m.filter(function(x){ return tDel.indexOf(x)<0; });
      t.forEach(function(x){ if(bb.indexOf(x)<0 && out.indexOf(x)<0) out.push(x); });
      return out;
    }
    if(m.length===t.length && t.length===bb.length){
      return m.map(function(x,i){ return same(x,bb[i]) ? clone(t[i]) : (tie==='theirs'&&!same(t[i],bb[i]) ? clone(t[i]) : clone(x)); });
    }
    return clone(tie==='theirs'?t:m);
  }
  return clone(tie==='theirs'?t:m);
}
// 子項目固定編號：沒有編號的舊資料，用「專案｜母項目｜名稱｜第幾個同名」算出固定編號（每台電腦算出來都一樣）
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; } return h.toString(36); }
function ensureSubIds(pid,row){
  const subs=row && row.subtasks; if(!isObj(subs)) return false;
  let changed=false;
  Object.keys(subs).forEach(function(parent){
    const arr=subs[parent]; if(!Array.isArray(arr)) return;
    const cnt={}; const used={};
    arr.forEach(function(s){ if(isObj(s)&&s.id) used[s.id]=1; });
    arr.forEach(function(s){
      if(!isObj(s)) return;
      const nm=String(s.name||''); cnt[nm]=(cnt[nm]||0)+1;
      if(!s.id){ let id='s'+hashStr(pid+'|'+parent+'|'+nm+'|'+cnt[nm]); while(used[id]) id+='x'; s.id=id; used[id]=1; changed=true; }
    });
  });
  return changed;
}
// 合併前先把每個專案補齊預設值、補上子項目編號，避免「null vs 沒填」或沒編號被誤判
function normState(st){
  const src=clone(st||{}); const out={};
  Object.keys(src).forEach(function(k){
    const v=src[k];
    if(k.charAt(0)!=='_' && isObj(v)){ const r=Object.assign({},v,rowDefaults(v)); ensureSubIds(k,r); out[k]=r; }
    else out[k]=v;
  });
  return out;
}
function mergeState(b,m,t,tie){
  const nb=normState(b), nm=normState(m), nt=normState(t);
  // 某一邊還沒有這個專案的資料 → 當成空白預設列（專案列不會被刪除）
  const rowKeys={};
  [nb,nm,nt].forEach(function(x){ Object.keys(x).forEach(function(k){ if(k.charAt(0)!=='_' && isObj(x[k])) rowKeys[k]=1; }); });
  Object.keys(rowKeys).forEach(function(k){ [nb,nm,nt].forEach(function(x){ if(!(k in x)) x[k]=rowDefaults({}); }); });
  return merge3(nb,nm,nt,tie);
}
// ===== 合併核心結束 =====

let apiChecked=false, apiVersion=0;
async function ensureNewBackend(ctx){
  // 每一次 POST 之前都確認（GET ?ping 對舊後端是無害的；POST 對舊後端等於覆寫資料）
  const j=await requestJson(SHEET_API_URL+'?ping=1',{cache:'no-store'},ctx);
  if(!j || !(j.api>=4)){
    oldBackend=true;
    setHint('⚠ 後端 Apps Script 還是舊版，為了保護資料，這個頁面暫停讀寫。請先部署新版 Apps Script。',true);
    throw new Error('old backend');
  }
  apiChecked=true; oldBackend=false; apiVersion=j.api;
}
function rowCount(st){ return Object.keys(st||{}).filter(k=>k[0]!=='_'&&st[k]&&typeof st[k]==='object'&&!Array.isArray(st[k])).length; }
function looksWiped(remote){
  const before=rowCount(lastSynced), now=rowCount(remote);
  if(before>=10 && now<before*0.5) return true;
  if((lastSynced._customProjects||[]).length>=3 && !(remote._customProjects||[]).length) return true;
  return false;
}
async function fetchRemote(ctx=authContext()){
  if(!ctx.token) throw new Error('not logged in');
  await ensureNewBackend(ctx);
  const data=await apiPost({action:'read',token:ctx.token},ctx);
  if(data && data.ok===false && (data.error==='login_required'||data.error==='session_expired')){
    // 通行證過期：保留這個分頁的草稿，重新登入同一個人後可以復原。
    const wasIn=!!ME; lockUI(true); loginError=wasIn?'session_expired':null; render(); renderLogin();
    throw new Error('not logged in');
  }
  if(!data || data.ok!==true || !data.state || typeof data.state!=='object' || Array.isArray(data.state)){
    // 回應不是新版格式（後端被換回舊版、或出錯）→ 絕不當成資料使用
    apiChecked=false; oldBackend=true; setHint('');
    throw new Error('bad read response');
  }
  oldBackend=false;
  applyConfig(data.config);
  applyIdentity(data.me||null, null);
  const st=data.state;
  if(st.action!==undefined || st.code!==undefined) { apiChecked=false; oldBackend=true; setHint(''); throw new Error('corrupted state'); }
  return st;
}

// ---- 使用者正在操作時不要重繪（避免打到一半的字被洗掉） ----
document.addEventListener('dragstart',()=>{ dragActive=true; },true);
document.addEventListener('dragend',()=>{ dragActive=false; },true);
document.addEventListener('drop',()=>{ setTimeout(()=>{ dragActive=false; },0); },true);
document.addEventListener('input',()=>{ lastTypingAt=Date.now(); },true);
document.addEventListener('keydown',()=>{ lastTypingAt=Date.now(); },true);
function isUserBusy(){
  if(dragActive) return true;
  const a=document.activeElement;
  if(!a||a===document.body||a.id==='searchbox'||a.id==='whoami-select') return false;
  const tag=a.tagName;
  if(tag==='TEXTAREA'||a.isContentEditable) return true;
  if(tag==='INPUT'){
    const ty=(a.type||'').toLowerCase();
    if(['checkbox','radio','button','submit','color','range'].includes(ty)) return false;
    return a.value!==a.defaultValue || (Date.now()-lastTypingAt<8000);
  }
  return false;
}
function renderPreservingScroll(){
  const sel='.ganttscroll,.monthgridscroll,.todoparentgrid,.wrap';
  const before=[...document.querySelectorAll(sel)].map(e=>[e.scrollLeft,e.scrollTop]);
  const y=window.scrollY;
  render();
  const after=[...document.querySelectorAll(sel)];
  if(after.length===before.length) after.forEach((e,i)=>{ e.scrollLeft=before[i][0]; e.scrollTop=before[i][1]; });
  window.scrollTo(0,y);
}
function requestRemoteRender(){
  if(isUserBusy()){ pendingRemoteRender=true; return; }
  pendingRemoteRender=false; renderPreservingScroll();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(pendingRemoteRender && !isUserBusy()) requestRemoteRender(); },400));

// ---- 提示 ----
function setSyncStatus(kind){
  if(kind==='ok'){ lastSyncAt=new Date(); }
  const t=lastSyncAt?` 最後同步 ${pad(lastSyncAt.getHours())}:${pad(lastSyncAt.getMinutes())}:${pad(lastSyncAt.getSeconds())}`:'';
  if(kind==='saving') setHint("● 儲存中…"+t);
  else if(kind==='fail') setHint((backupFailed?"⚠ 尚未確認同步完成，分頁暫存也失敗，請勿重新整理或關閉分頁。":"⚠ 尚未確認同步完成，修改已暫存在這個分頁，連上後會自動補傳（請先不要關掉分頁）。")+t,true);
  else if(window._pendingBackup) setHint("⚠ 請先處理這個分頁的草稿，自動寫入已暫停。"+t,true);
  else if(!same(state,lastSynced)) setHint("● 尚有未同步修改，請保留此分頁。"+t,true);
  else setHint("● 自動同步中：同事的修改約 15 秒內會自動出現，不用重新整理。"+t);
}
function changedProjectsSummary(prev,next){
  const keys=new Set([...Object.keys(prev||{}),...Object.keys(next||{})]);
  const items=[];
  const np=normState(prev||{}), nn=normState(next||{});
  keys.forEach(k=>{
    if(k.startsWith('_')) return;
    // 只算真正有人改的內容（系統自動補上的預設欄位、子項目編號不算）
    if(same(np[k]||normState({[k]:{}})[k], nn[k]||normState({[k]:{}})[k])) return;
    const by=(next[k]&&next[k].lastEdit&&next[k].lastEdit.by)||'';
    if(by && whoAmI && by===whoAmI) return;
    const p=getProject(k) || ((next._customProjects||[]).find(c=>c.id===k));
    items.push({name:p?getName(p):'一個專案', by});
  });
  return items;
}
let syncToastTimer=null;
function showSyncToast(items){
  if(!items.length) return;
  const box=document.getElementById("synctoast"); if(!box) return;
  const first=items[0];
  const who=first.by?esc(first.by)+' ':'同事';
  const msg = items.length===1 ? `🔄 ${who}更新了「${esc(first.name)}」` : `🔄 已同步其他人的 ${items.length} 個專案更新（${esc(first.name)} 等）`;
  box.innerHTML=`<div style="background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.18);">${msg}</div>`;
  clearTimeout(syncToastTimer);
  syncToastTimer=setTimeout(()=>{ box.innerHTML=''; },5000);
}
function applyMerged(next){
  const prev=state;
  state=next;
  if(!same(prev,next)){
    showSyncToast(changedProjectsSummary(prev,next));
    requestRemoteRender();
  }
}

async function loadFromSheet(){
  if(!sheetConfigured()){
    setHint("尚未設定 Google Sheet 網址，目前只存在你這台瀏覽器（單機模式）。",true);
    const backup=localBackupLoad(); if(backup) state=backup;
    render();
    return;
  }
  if(!authToken){ lockUI(true); render(); return; }
  const ctx=authContext();
  try{
    const data=await fetchRemote(ctx);
    state=data; lastSynced=clone(data);
    offerDraftIfAny();
    setSyncStatus('ok');
    render();
  }catch(e){
    console.error(e);
    if(!isCurrent(ctx)) return;
    if(authToken) setHint("⚠ 連不到 Google Sheet，請稍後按「立即同步」再試。",true);
    render();
  }
}
async function pollOnce(force){
  if(!sheetConfigured()||!isAuthenticated()||window._pendingBackup||pollBusy||savingCount>0) return;
  if(document.hidden && !force) return;
  const ctx=authContext();
  pollBusy=true;
  try{
    const remote=await fetchRemote(ctx);
    assertCurrent(ctx);
    if(savingCount>0||window._pendingBackup) return; // 存檔中途開始了，存檔流程自己會合併
    if(looksWiped(remote)){ setHint('⚠ 雲端資料看起來不完整（專案數量突然大減），為了保護資料已暫停同步，請聯絡 Jenny。',true); return; }
    const merged=mergeState(lastSynced,state,remote);
    lastSynced=clone(remote);
    applyMerged(merged); localBackupSave();
    setSyncStatus('ok');
    if(!same(state,lastSynced)) persist(); // 之前存失敗的修改，自動補傳
  }catch(e){ console.error(e); if(isCurrent(ctx)&&isAuthenticated()) setSyncStatus('fail'); }
  finally{ pollBusy=false; }
}
window.manualRefresh=async function(){ await saveChain; await pollOnce(true); };
setInterval(()=>{ pollOnce(false); if(pendingRemoteRender) requestRemoteRender(); },POLL_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pollOnce(false); });

// ---- 寫入（排隊執行，一次一筆）----
function persist(){
  if(!isAuthenticated()||window._pendingBackup) return Promise.resolve();
  localBackupSave();
  if(!sheetConfigured()){ setHint("尚未設定 Google Sheet 網址，這次修改只存在你這台瀏覽器。",true); return Promise.resolve(); }
  const ctx=authContext();
  savingCount++;
  const p=saveChain.then(()=>doPersist(ctx)).finally(()=>{ savingCount--; });
  saveChain=p.catch(()=>{});
  return saveChain;
}
async function doPersist(ctx){
  if(!isCurrent(ctx)||!isAuthenticated()||window._pendingBackup||same(state,lastSynced)) return;
  setSyncStatus('saving');
  let dispatched=false, submitted=null, write=null;
  try{
    await ensureNewBackend(ctx);
    // 把「我的基準」和「我的版本」一起送到 Google，由 Google 在鎖定狀態下跟最新資料合併、檢查權限
    const pre=clone(lastSynced), mine=clone(state);
    submitted=mine; write={ctx,base:pre,sent:mine}; activeWrite=write;
    localBackupSave(); // 送出前先存：送出途中重新整理也找得回來
    dispatched=true;
    const j=await apiPost({action:'write',token:ctx.token,base:pre,data:mine},ctx);
    if(j && j.ok===false && (j.error==='login_required'||j.error==='session_expired')){
      activeWrite=null; localBackupSave(); // 伺服器明確拒絕：沒有寫入，草稿保留給重新登入後復原
      lockUI(true); loginError='session_expired'; render(); renderLogin(); return;
    }
    if(!j || j.ok!==true || !j.state || typeof j.state!=='object'){ dispatched=false; activeWrite=null; throw new Error('write failed: '+(j&&j.error)); }
    if(looksWiped(j.state)){ dispatched=false; throw new Error('remote looks wiped'); }
    lastSynced=clone(j.state);
    applyMerged(mergeState(mine,state,j.state));
    activeWrite=null;
    localBackupSave(); setSyncStatus('ok');
  }catch(e){
    console.error(e);
    if(!isCurrent(ctx)||!isAuthenticated()) return;
    if(e.message==='remote looks wiped') setHint('⚠ 資料完整性檢查未通過，已暫停這次同步，請聯絡管理者。',true);
    else if(dispatched){
      // 已送出但沒收到結果（逾時或斷線）：伺服器可能已經寫入，不自動重送，交給使用者決定。
      const backup={...makeBackup(true),base:clone(write.base),sent:submitted};
      activeWrite=null; writeBackup(backup); showRestoreBanner(backup);
      setHint('⚠ 寫入結果尚未確認，可能已經儲存。草稿已保留，自動重送已暫停。',true);
    } else { localBackupSave(); setSyncStatus('fail'); }
  }finally{ if(activeWrite===write) activeWrite=null; }
}

function isValidISODate(v){
  if(!v) return true;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const y=Number(v.slice(0,4));
  return y>=2000 && y<=2100;
}

window.handleSubtaskDropAt=async function(e,pid,toTask,toIndex){
  e.preventDefault();
  let d=dragSubtask;
  if(!d){
    try{ d=JSON.parse(e.dataTransfer.getData("text/plain")); }catch(err){ return; }
  }
  dragSubtask=null;
  if(!d || d.pid!==pid) return;
  const p=getProject(pid); const cur=getRow(pid);
  const subtasks=Object.assign({},cur.subtasks);
  if(d.fromTask===toTask){
    const arr=materializedSubs(pid,toTask).slice();
    if(d.si<0||d.si>=arr.length) return;
    const [moved]=arr.splice(d.si,1);
    let insertAt=toIndex;
    if(d.si<toIndex) insertAt=toIndex-1;
    arr.splice(insertAt,0,moved);
    subtasks[toTask]=arr;
  } else {
    const fromArr=materializedSubs(pid,d.fromTask).slice();
    if(d.si<0||d.si>=fromArr.length) return;
    const [moved]=fromArr.splice(d.si,1);
    subtasks[d.fromTask]=fromArr;
    const toArr=materializedSubs(pid,toTask).slice();
    toArr.splice(toIndex,0,moved);
    subtasks[toTask]=toArr;
  }
  state[pid]=Object.assign({},cur,{subtasks}); touch(pid); render(); await persist();
};

window.renameVendor=async function(oldName){
  const input=prompt(`將委外單位「${oldName}」改名為：`, oldName);
  if(!input) return;
  const nn=input.trim();
  if(!nn || nn===oldName) return;
  if(TEAM.includes(nn)){ alert('這個名字跟現有的員工/夥伴重複，請換一個名字。'); return; }
  let changedCount=0;
  ALLP.forEach(p=>{
    const cur=getRow(p.id);
    let changed=false;
    const tasks=Object.assign({},cur.tasks);
    Object.keys(tasks).forEach(k=>{
      const t=tasks[k];
      if(t && typeof t==='object' && t.assignee===oldName){ tasks[k]=Object.assign({},t,{assignee:nn}); changed=true; }
    });
    const subtasks=Object.assign({},cur.subtasks);
    Object.keys(subtasks).forEach(k=>{
      const arr=subtasks[k];
      if(Array.isArray(arr)){
        let arrChanged=false;
        const newArr=arr.map(s=>{ if(s && s.assignee===oldName){ arrChanged=true; return Object.assign({},s,{assignee:nn}); } return s; });
        if(arrChanged){ subtasks[k]=newArr; changed=true; }
      }
    });
    if(changed){ state[p.id]=Object.assign({},cur,{tasks,subtasks}); touch(p.id); changedCount++; }
  });
  if(changedCount===0){ alert('沒有找到指派給這個名字的任務。'); return; }
  render();
  await persist();
};

function myInboxOut(){ const me=myName(); return inboxList().filter(it=>it.from===me); }
function isNightNow(){ const h=new Date().getHours(); return h>=21||h<9; }
function nextMorning9(){ const d=new Date(); if(d.getHours()>=9) d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d.getTime(); }
function newId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
// ---- 規則比對：猜專案、對象、日期、急不急 ----
function bigrams(str){ const t=String(str||'').toLowerCase().replace(/[\s\-–_()（）·.、,，\/「」]+/g,''); const out=new Set(); for(let i=0;i<t.length-1;i++) out.add(t.slice(i,i+2)); return out; }
function rankProjects(text){
  const tb=bigrams(text); if(!tb.size) return [];
  const list=ALLP.map(p=>({p,bg:bigrams(getName(p))})); const df={};
  list.forEach(x=>x.bg.forEach(g=>{ df[g]=(df[g]||0)+1; }));
  const N=Math.max(list.length,1);
  return list.map(x=>{ let sc=0; x.bg.forEach(g=>{ if(tb.has(g)) sc+=Math.log(1+N/df[g]); }); if(String(text).includes(getName(x.p))) sc+=10; return {p:x.p,score:sc}; })
    .filter(x=>x.score>=1.8).sort((a,b)=>b.score-a.score);
}
function guessPerson(text){
  const me=myName(); const t=String(text||''); let best=null;
  PEOPLE.filter(n=>n&&n!==me).sort((a,b)=>b.length-a.length).forEach(n=>{
    const re=new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'); const m=re.exec(t); if(!m) return;
    const before=t.slice(Math.max(0,m.index-2),m.index); const bonus=/[請給找@叫交]/.test(before)?-1000:0;
    const pos=m.index+bonus; if(!best||pos<best.pos) best={n,pos};
  });
  return best?best.n:'';
}
function guessDate(text){
  const t=String(text||''); const now=new Date(); now.setHours(0,0,0,0);
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  let m=t.match(/(20\d{2})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/); if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); if(!isNaN(d)) return iso(d); }
  m=t.match(/(\d{1,2})[\/月](\d{1,2})(?!\d)/); if(m){ const mo=+m[1], da=+m[2]; if(mo>=1&&mo<=12&&da>=1&&da<=31){ let d=new Date(now.getFullYear(),mo-1,da); if(d<new Date(now.getTime()-60*86400000)) d=new Date(now.getFullYear()+1,mo-1,da); return iso(d); } }
  if(/大後天/.test(t)){ const d=new Date(now); d.setDate(d.getDate()+3); return iso(d); }
  if(/後天/.test(t)){ const d=new Date(now); d.setDate(d.getDate()+2); return iso(d); }
  if(/明天|明日/.test(t)){ const d=new Date(now); d.setDate(d.getDate()+1); return iso(d); }
  if(/今天|今日/.test(t)) return iso(now);
  m=t.match(/(下下|下|這|本)?(?:週|周|星期|禮拜)([一二三四五六日天])/); if(m){ const map={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0}; const want=map[m[2]];
    const cur=now.getDay(); const curMon=(cur+6)%7; const wantMon=(want+6)%7; let add=wantMon-curMon;
    if(m[1]==='下') add+=7; else if(m[1]==='下下') add+=14; else if(!m[1] && add<0) add+=7;
    const d=new Date(now); d.setDate(d.getDate()+add); return iso(d); }
  if(/月底/.test(t)){ const d=new Date(now.getFullYear(),now.getMonth()+1,0); return iso(d); }
  return '';
}
function guessPriority(text){ const t=String(text||''); if(/急|盡快|儘快|馬上|立刻|ASAP/i.test(t)) return 'urgent'; if(/有空|不急|慢慢/.test(t)) return 'low'; return 'normal'; }
function applyGuess(force){
  const t=inboxDraft.text; const g=inboxDraft._guessed||{};
  const ranked=rankProjects(t); const pid=ranked.length?ranked[0].p.id:'';
  const to=guessPerson(t), due=guessDate(t), pr=guessPriority(t);
  // 使用者手動改過的欄位就不再覆蓋
  if(force||!inboxDraft._manual_pid) inboxDraft.pid=pid;
  if(force||!inboxDraft._manual_to) inboxDraft.to=to||inboxDraft.to;
  if(force||!inboxDraft._manual_due) inboxDraft.due=due;
  if(force||!inboxDraft._manual_priority) inboxDraft.priority=pr;
  inboxDraft._ranked=ranked.slice(0,5).map(x=>x.p.id);
}

  return `<option value="">（不指定專案）</option>${r.length?`<optgroup label="系統猜的">${r.map(o).join('')}</optgroup>`:''}<optgroup label="全部專案">${rest.map(o).join('')}</optgroup>`;

window.sendInbox=async function(){
  const d=inboxDraft; const text=(document.getElementById('inboxtext')||{}).value||d.text;
  if(!text.trim()){ alert('請先輸入要交辦的內容'); return; }
  if(!d.to){ alert('請選擇要交給誰'); return; }
  const it={id:newId('i'),from:myName(),to:d.to,pid:d.pid||'',text:text.trim(),due:d.due||'',priority:d.priority||'normal',createdAt:Date.now(),sendAt:d.send==='morning'?nextMorning9():Date.now(),status:'sent',replies:[]};
  state._inbox=inboxList().concat([it]);
  inboxFormOpen=false; inboxDraft={text:'',pid:'',to:'',due:'',priority:'normal',send:''};
  render(); await persist();
};
function updInbox(id,fn){ state._inbox=inboxList().map(it=>it.id===id?fn(Object.assign({},it)):it); }
window.ackInbox=async function(id){ updInbox(id,it=>{ if(it.status==='sent') it.status='ack'; return it; }); render(); await persist(); };
window.doneInbox=async function(id){ updInbox(id,it=>{ it.status='done'; it.doneAt=Date.now(); return it; }); render(); await persist(); };
window.reopenInbox=async function(id){ updInbox(id,it=>{ it.status=it.scheduled?'scheduled':'ack'; delete it.doneAt; return it; }); render(); await persist(); };
window.withdrawInbox=async function(id){ if(!confirm('確定要撤回這件交辦嗎？')) return; state._inbox=inboxList().filter(it=>it.id!==id); render(); await persist(); };
window.replyInbox=async function(id,ctx){

};
window.openSchedule=function(id,ctx){ const it=inboxList().find(x=>x.id===id); if(!it) return; const p=getProject(it.pid); inboxSched={id, ctx:ctx||'m', pid:it.pid||'', parent:p?(taskList(p)[0]||''):'', due:it.due||''}; inboxOpen=true; render(); };
window.schedSet=function(k,v){ if(!inboxSched) return; inboxSched[k]=v; if(k==='pid'){ const p=getProject(v); inboxSched.parent=p?(taskList(p)[0]||''):''; render(); } };
window.cancelSchedule=function(){ inboxSched=null; render(); };
window.confirmSchedule=async function(){
  const sc=inboxSched; if(!sc) return; const it=inboxList().find(x=>x.id===sc.id); const p=getProject(sc.pid);
  if(!it||!p){ alert('請先選擇要排進哪個專案'); return; }
  let parent=sc.parent; const nameEl=document.getElementById('schedname'); const subName=((nameEl||{}).value||it.text).trim().slice(0,120);
  const cur=getRow(p.id); let custom=cur.custom.slice(), taskOrder=cur.taskOrder.slice();
  if(parent==='__new__'||!parent){ parent='交辦事項'; if(!taskList(p).includes(parent)){ custom.push(parent); if(taskOrder.length) taskOrder.push(parent); } }
  const subtasks=Object.assign({},cur.subtasks); const arr=(taskList(p).includes(parent)?materializedSubs(p.id,parent):[]);
  arr.push({name:subName,done:false,assignee:it.to,start:sc.due||'',end:sc.due||'',note:`交辦：${it.from}`});
  subtasks[parent]=arr;
  state[p.id]=Object.assign({},cur,{custom,taskOrder,subtasks}); touch(p.id);
  updInbox(it.id,x=>{ x.status='scheduled'; x.pid=p.id; x.scheduled={pid:p.id,parent}; return x; });
  inboxSched=null; render(); await persist();
};
function fmtWhen(ts){ if(!ts) return ''; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function inboxItemHtml(it, role, ctx){
  ctx=ctx||'m';

  const pr=it.priority&&it.priority!=='normal'?`<span class="ibadge ip-${esc(it.priority)}">${INBOX_PR_LABEL[it.priority]}</span>`:'';
  const who=role==='out'?`→ 交給 <b>${esc(it.to)}</b>`:`<b>${esc(it.from)}</b> 交辦`;
  const proj=p?`｜<a href="javascript:void(0)" ${uiEvent('click','goToProject',[String(p.id)])}>${esc(getName(p))}</a>`:'';

  const canAct=(it.to===me)||(p&&getRow(p.id).assignee===me)||isAdmin();

  const replyBox=!pending?`<input type="text" id="rep-${ctx}-${it.id}" placeholder="回覆，例如：10/15 來不及，可以 10/18 嗎？" style="flex:1;min-width:160px;font-size:.78rem;" ${uiEvent('keydown','replyInboxEnter',[String(it.id),String(ctx)])}><button class="mini" ${uiEvent('click','replyInbox',[String(it.id),String(ctx)])}>💬 回覆</button>`:'';

        ${getProject(inboxSched.pid)?`<label>放在哪個母項目<select ${uiEvent('change','schedSet',['parent'],'value')}>${taskList(getProject(inboxSched.pid)).map(t=>`<option value="${esc(t)}" ${inboxSched.parent===t?'selected':''}>${esc(t)}</option>`).join('')}<option value="__new__" ${inboxSched.parent==='__new__'?'selected':''}>＋ 新增「交辦事項」母項目</option></select></label>`:''}
        <label>子項目名稱<input type="text" id="schedname" value="${esc(it.text.slice(0,120))}" style="min-width:240px;"></label>

  const sched=it.scheduled&&getProject(it.scheduled.pid)?`<div class="small" style="color:#24506e;">📅 已排入：${esc(getName(getProject(it.scheduled.pid)))} ／ ${esc(it.scheduled.parent)}</div>`:'';
  return `<div class="inboxitem ${it.status==='sent'&&role==='in'?'new':''}">

    <div class="txt">${esc(it.text)}</div>${sched}${replies}
    <div class="acts">${acts}${replyBox}</div>${schedForm}

function inboxSection(title,list,role,empty){
  const live=list.filter(it=>it.status!=='done'), done=list.filter(it=>it.status==='done');
  const ord={urgent:0,normal:1,low:2};
  live.sort((a,b)=>(a.status==='sent'?0:1)-(b.status==='sent'?0:1)||ord[a.priority||'normal']-ord[b.priority||'normal']||(a.due||'9').localeCompare(b.due||'9'));
  return `<div><div style="font-weight:700;">${title}（${live.length}）</div>
    ${live.length?live.map(it=>inboxItemHtml(it,role)).join(''):`<div class="small" style="margin-top:6px;">${empty}</div>`}
    ${done.length?`<div class="small" style="margin-top:6px;cursor:pointer;color:var(--sub);" ${uiEvent('click','toggleInboxShowDone',[])}>${inboxShowDone?'▾':'▸'} 已完成 ${done.length} 件</div>${inboxShowDone?done.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,20).map(it=>inboxItemHtml(it,role)).join(''):''}`:''}
  </div>`;
}
function renderInbox(){
  const box=document.getElementById('inbox'); if(!box) return;
  if(!ME){ box.innerHTML=''; return; }
  const inc=myInboxIn(), out=myInboxOut();
  const nNew=inc.filter(it=>it.status==='sent').length, nIn=inc.filter(it=>it.status!=='done').length;
  const nOut=out.filter(it=>it.status!=='done').length, nReply=out.filter(it=>it.status!=='done'&&(it.replies||[]).some(r=>r.by!==myName())).length;
  const summary=`<span style="font-weight:700;">📥 交辦</span>
    ${nNew?`<span class="ibadge ib-sent" style="font-size:.78rem;">你有 ${nNew} 件新交辦</span>`:`<span class="small">交辦給我 ${nIn} 件</span>`}
    <span class="small">｜我交辦出去 ${nOut} 件進行中${nReply?`（${nReply} 件有回覆）`:''}</span>
    <button class="mini" style="background:var(--accent2);color:#fff;border-color:var(--accent2);" ${uiEvent('click','openInboxForm',[])}>＋ 交辦一件事</button>
    <button class="mini" ${uiEvent('click','toggleInbox',[])}>${inboxOpen?'收合':'展開'}</button>`;
  const form=inboxFormOpen?`<div class="inboxform">
      <textarea id="inboxtext" placeholder="想到什麼就打，例如：綠光市集 主視覺請阿哲 10/15 前給初稿" ${uiEvent('input','inboxType',[],'value')}>${esc(inboxDraft.text)}</textarea>
      <div class="small" style="color:var(--sub);">系統會從你打的字猜「專案、交給誰、日期、急不急」，送出前可以再改。</div>
      <div class="inboxfields" id="inboxfields"></div>
    </div>`:'';
  const cols=inboxOpen?`<div class="inboxcols">
      ${inboxSection('交辦給我的',inc,'in','目前沒有別人交辦給你的事')}
      ${inboxSection('我交辦出去的',out,'out','你還沒有交辦任何事')}
    </div>`:'';
  box.innerHTML=`<div class="inboxbox"><div class="inboxhead">${summary}</div>${form}${cols}</div>`;
  if(inboxFormOpen) renderInboxFields();

function dispatchUiEvent(event){
  // 先記下事件路徑：動作執行後畫面可能重繪，原本的元素會被移除。
  const path=typeof event.composedPath==='function'?event.composedPath():(()=>{
    const out=[]; for(let n=event.target;n;n=n.parentElement) out.push(n); return out;
  })();
  const allowed=UI_ACTIONS[event.type];
  if(!allowed) return;
  for(const el of path){
    if(!el || typeof el.getAttribute!=='function') continue;
    const raw=el.getAttribute('data-ui-'+event.type);
    if(raw===null) continue;
    let d; try{ d=JSON.parse(raw); }catch(e){ return; }
    if(!isObj(d)||typeof d.action!=='string'||!Object.hasOwn(allowed,d.action)||
       !Array.isArray(d.args)||!d.args.every(v=>v===null||['string','number','boolean'].includes(typeof v))||
       (d.input!=null&&(typeof d.input!=='string'||!Object.hasOwn(UI_INPUTS,d.input)))||
       (d.stop!==undefined&&typeof d.stop!=='boolean')) return;
    // 還沒登入時，只有登入本身可以執行（伺服器仍會再檢查身分）。
    if(!ME && !UI_PRELOGIN.has(event.type+':'+d.action)) return;
    // 有待處理草稿時，只能復原、放棄或登出，避免新修改蓋掉草稿。
    if(window._pendingBackup && !(event.type==='click'&&['restoreBackup','ignoreBackup','logout'].includes(d.action))) return;
    if(el.disabled) return;
    const args=d.args.slice();
    if(d.input!=null) args.push(UI_INPUTS[d.input](el));
    if(d.stop) event.stopPropagation();
    const r=allowed[d.action](el,event,args);
    if(r && typeof r.catch==='function') r.catch(e=>console.error(e));
    if(d.stop) break;
  }
}
Object.keys(UI_ACTIONS).forEach(type=>document.addEventListener(type,dispatchUiEvent));

document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  if(!isAuthenticated()||window._pendingBackup) return;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); view=b.dataset.v; if(view==="person") priorityTab="capacity"; render();
  backState=null; document.getElementById("backbtn").innerHTML="";
}));

renderLogin();

document.getElementById("searchbox").addEventListener("input",e=>{ searchTerm=e.target.value.trim(); renderProjectView(); });

render();
loadFromSheet();
</script>
