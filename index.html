function fmt(n){return "NT$"+Math.round(n).toLocaleString();}
function pad(n){return n<10?"0"+n:""+n;}
function lastDay(y,m){return new Date(y,m,0).getDate();}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function addDaysISO(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function shortDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return (Number(y)!==REF_YEAR?y+"/":"")+`${Number(m)}/${Number(d)}`; }
function mdToISO(md,p){
  if(!md) return '';
  const parts=md.replace(/[^0-9\/]/g,'').split('/');
  if(parts.length===3){
    let y=parseInt(parts[0],10), m=parseInt(parts[1],10), d=parseInt(parts[2],10);
    if(!m||!d||m<1||m>12||d<1||d>31) return '';
    if(!y||y<2000) y=REF_YEAR;
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  if(parts.length!==2) return '';
  const m=parseInt(parts[0],10), d=parseInt(parts[1],10);
  if(!m||!d||m<1||m>12||d<1||d>31) return '';
  // no year given: guess using the project's own start/end year span (handles cross-year projects)
  if(p){
    const range=getRange(p);
    const sy=Number(range.start.split('-')[0]), ey=Number(range.end.split('-')[0]);
    const candidates=sy===ey?[sy]:[sy,ey];
    for(const y of candidates){
      const iso=`${y}-${pad(m)}-${pad(d)}`;
      if(iso>=range.start && iso<=range.end) return iso;
    }
    return `${sy}-${pad(m)}-${pad(d)}`;
  }
  return `${REF_YEAR}-${pad(m)}-${pad(d)}`;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function relTime(ts){
  if(!ts) return "";
  const diff=Math.max(0,Date.now()-ts); const m=Math.floor(diff/60000);
  if(m<1) return "剛剛"; if(m<60) return m+"分鐘前";
  const h=Math.floor(m/60); if(h<24) return h+"小時前";
  const d=Math.floor(h/24); return d+"天前";
}

function collaboratorsOf(p){

function periodsFor(p){
  const range=getRange(p);
  let [sy,sm]=range.start.split('-').map(Number);
  let [ey,em]=range.end.split('-').map(Number);
  const months=[]; let y=sy,m=sm,guard=0;
  while((y<ey || (y===ey && m<=em)) && guard<24){
    months.push(`${m}月檔`);
    m++; if(m>12){m=1;y++;} guard++;
  }
  return months.length?months:["執行檔期"];
}
function baseTasksFor(p){
  if(p.cat==="政府") return BASE_TASKS.concat(GOV_EXTRA);
  if(p.cat==="2C零售") return periodsFor(p);
  return BASE_TASKS;
}
function baseTasksVisible(p){
  const cur=getRow(p.id); const raw=baseTasksFor(p);
  const deletes=new Set(cur.taskDeletes); const renames=cur.taskRenames;
  return raw.filter(n=>!deletes.has(n)).map(n=>({raw:n, display:renames[n]||n}));
}
function taskList(p){ return orderedEntries(p).map(e=>e.display); }
function isCustomIdx(p,idx){ const e=entryAt(p,idx); return !!e && e.type==='custom'; }
function customPos(p,idx){ const e=entryAt(p,idx); if(!e||e.type!=='custom') return -1; return getRow(p.id).custom.indexOf(e.key); }
function rawBaseNameAt(p,idx){ const e=entryAt(p,idx); return (e&&e.type==='base')?e.key:null; }
function findTaskDisplayByRaw(p,rawName){ const bv=baseTasksVisible(p); const m=bv.find(x=>x.raw===rawName); return m?m.display:null; }
function effectiveOrder(p){
  const cur=getRow(p.id);
  if(cur.taskOrder && cur.taskOrder.length) return cur.taskOrder;
  return baseTasksVisible(p).map(x=>x.raw).concat(cur.custom);
}
function orderedEntries(p){
  const cur=getRow(p.id);
  const order=effectiveOrder(p);
  const baseVisible=baseTasksVisible(p); const baseMap={}; baseVisible.forEach(x=>{ baseMap[x.raw]=x.display; });
  const customSet=new Set(cur.custom);
  const seen=new Set(); const result=[];
  order.forEach(key=>{
    if(baseMap[key]!==undefined && !seen.has('b:'+key)){ result.push({type:'base',key,display:baseMap[key]}); seen.add('b:'+key); }
    else if(customSet.has(key) && !seen.has('c:'+key)){ result.push({type:'custom',key,display:key}); seen.add('c:'+key); }
  });
  baseVisible.forEach(x=>{ if(!seen.has('b:'+x.raw)){ result.push({type:'base',key:x.raw,display:x.display}); seen.add('b:'+x.raw); } });
  cur.custom.forEach(c=>{ if(!seen.has('c:'+c)){ result.push({type:'custom',key:c,display:c}); seen.add('c:'+c); } });
  return result;
}
function entryAt(p,idx){ return orderedEntries(p)[idx]||null; }
function materializedSubs(pid,t){
  const cur=getRow(pid);
  if(cur.subtasks[t] && cur.subtasks[t].length) return cur.subtasks[t].slice();
  if(t==="結案") return ["結案報告","案例建置","宣傳曝光"].map(name=>({name,done:false,assignee:'',start:'',end:''}));
  return [];
}
function defaultAssigneeFor(p,name){
  return "";
}
function taskInfo(p,name){
  const r=getRow(p.id); const t=r.tasks[name];
  if(!t) return {done:false,assignee:defaultAssigneeFor(p,name),start:"",end:""};
  if(typeof t==="boolean") return {done:t,assignee:"",start:"",end:""};
  return {done:!!t.done, assignee:t.assignee||"", start:t.start||"", end:t.end||""};
}
function taskProgress(p){
  const list=taskList(p);
  let done=0,total=0;
  list.forEach(t=>{
    const subs=materializedSubs(p.id,t);
    if(subs.length){ total+=subs.length; done+=subs.filter(s=>s.done).length; }
    else if(p.cat!=="2C零售"){ total+=1; if(taskInfo(p,t).done) done+=1; }
  });
  return {done,total};
}

function urgency(p){
  const r=getRow(p.id);
  if(r.status==="已完成") return "later";
  const end=new Date(getRange(p).end+"T23:59:59");
  const diffDays=Math.ceil((end-new Date())/86400000);
  if(diffDays<0) return "overdue";
  if(diffDays<=7) return "soon7";
  if(diffDays<=30) return "soon30";
  return "later";
}

function marginOf(p){ const r=getRow(p.id); const cost=(r.cost===null||r.cost==="")?0:Number(r.cost); return getEstRev(p)-cost; }
function costNote(p){
  const r=getRow(p.id);
  if(r.cost===null||r.cost==="") return `<span class="costnote ok">尚未登錄</span>`;
  const ratio=Number(r.cost)/getEstRev(p);
  if(ratio>=1) return `<span class="costnote over">已超支 ${Math.round(ratio*100)}%</span>`;
  if(ratio>=0.8) return `<span class="costnote near">接近上限 ${Math.round(ratio*100)}%</span>`;
  return `<span class="costnote ok">占營收 ${Math.round(ratio*100)}%</span>`;
}
function getReceipts(id){
  const r=getRow(id);
  if(r.receipts && r.receipts.length) return r.receipts;
  if(r.actual!==null && r.actual!=='') return [{amount:Number(r.actual), month:r.invoiceMonth||null}];
  return [];
}
function totalActual(p){ return getReceipts(p.id).reduce((s,x)=>s+Number(x.amount||0),0); }
function diffLabel(p){
  const list=getReceipts(p.id);
  if(!list.length) return `<span class="diff wait">尚未登錄</span>`;
  const total=totalActual(p);
  const diff=total-getEstRev(p);
  if(diff<0) return `<span class="diff short">短收 ${fmt(-diff)}</span>`;
  if(diff>0) return `<span class="diff over">超收 ${fmt(diff)}</span>`;
  return `<span class="diff over">✓ 相符</span>`;
}

function paginatedBody(key,itemsHtml,emptyMsg){
  const total=itemsHtml.length;
  if(!total) return emptyMsg;
  const level=priorityExpandLevel[key]||0;
  const limit = level===0?5 : level===1?10 : total;
  const shown=itemsHtml.slice(0,limit).join("");
  let btn='';
  if(limit<total){
    const nextLabel = level===0?`顯示10個（共${total}項）`:`顯示全部（共${total}項）`;
    btn=`<button class="mini" style="margin-top:8px;" onclick="advancePriorityExpand('${key}')">${nextLabel}</button>`;
  } else if(level>0){
    btn=`<button class="mini" style="margin-top:8px;" onclick="resetPriorityExpand('${key}')">只顯示前5項</button>`;
  }
  return shown+btn;
}
function lagInfo(p){
  const r=getRow(p.id);
  if(r.status==="已完成") return {overdue:false, lag:0, done:true};
  const range=getRange(p);
  const start=new Date(range.start+"T00:00:00"), end=new Date(range.end+"T23:59:59");
  const now=new Date();
  const overdue = now>end;
  const totalMs=end-start;
  let lag=0;
  if(totalMs>0){
    const elapsed=Math.min(Math.max(now-start,0), totalMs);
    const timeRatio=elapsed/totalMs;
    const tp=taskProgress(p); const taskRatio=tp.total?tp.done/tp.total:0;
    lag=timeRatio-taskRatio;
  }
  return {overdue, lag, done:false};
}
function lagBadge(li){
  if(li.done) return `<span class="badge later">已完成</span>`;
  if(li.overdue) return `<span class="badge overdue">已逾期</span>`;
  if(li.lag>=0.2) return `<span class="badge soon7">進度落後${Math.round(li.lag*100)}%</span>`;
  return `<span class="badge later">進度正常</span>`;
}

function renderPriority(){
  const box=document.getElementById("priority");
  const LAG_THRESHOLD=0.2;
  const list=ALLP.filter(p=>{
    const r=getRow(p.id); if(r.status==="已完成") return false;
    const li=lagInfo(p);
    return li.overdue || li.lag>=LAG_THRESHOLD;
  }).sort((a,b)=>{
    const la=lagInfo(a), lb=lagInfo(b);
    if(la.overdue!==lb.overdue) return la.overdue?-1:1;
    return lb.lag-la.lag;
  });

  const payGroup=list.filter(p=>getRow(p.id).status==="待收款");
  const execGroup=list.filter(p=>{const s=getRow(p.id).status; return s==="未開始"||s==="進行中";});
  const rowWithLag=p=>projRowHtml(p, lagBadge(lagInfo(p)));
  const urgentBody=execGroup.length? paginatedBody('urgent-exec',execGroup.map(rowWithLag),'') : `<div class="small">✓ 目前沒有已逾期或進度明顯落後、還在執行中的案子</div>`;
  const payBody=payGroup.length? paginatedBody('urgent-pay',payGroup.map(rowWithLag),'') : `<div class="small">✓ 目前沒有已逾期或進度明顯落後的待收款案子</div>`;

  // 任務層級急迫（不管專案本身狀態），含負責人與前後步驟
  const taskUrgent=[];
  ALLP.forEach(p=>{
    if(getRow(p.id).status==="已完成") return;
    const topList=taskList(p);
    topList.forEach((tn)=>{
      const subs=materializedSubs(p.id,tn);
      if(subs.length){
        subs.forEach((s,si)=>{
          if(s.done||!s.end) return;
          const d=new Date(s.end+"T23:59:59"); const days=Math.ceil((d-new Date())/86400000);
          if(days<=7) taskUrgent.push({p,label:`${tn}／${s.name}`,end:s.end,days,assignee:s.assignee,prev:si>0?subs[si-1].name:null,next:si<subs.length-1?subs[si+1].name:null});
        });
      } else {
        const info=taskInfo(p,tn);
        if(info.done||!info.end) return;
        const d=new Date(info.end+"T23:59:59"); const days=Math.ceil((d-new Date())/86400000);
        if(days<=7){
          const idx=topList.indexOf(tn);
          taskUrgent.push({p,label:tn,end:info.end,days,assignee:info.assignee,prev:idx>0?topList[idx-1]:null,next:idx<topList.length-1?topList[idx+1]:null});
        }
      }
    });
  });
  taskUrgent.sort((a,b)=>a.days-b.days);
  const taskItemsHtml=taskUrgent.map(x=>{
    const ctx=(x.prev||x.next)?`<div class="small" style="margin-top:2px;">${x.prev?`上一步：${x.prev}`:''}${x.prev&&x.next?'　':''}${x.next?`下一步：${x.next}`:''}</div>`:'';
    return `<div class="prow" onclick="goToProject('${x.p.id}')" style="cursor:pointer;">
      <div class="prow-top"><span class="pname">${getName(x.p)} － ${x.label}</span>${assigneeTag(x.assignee)}<span class="badge ${x.days<0?'overdue':'soon7'}">${x.days<0?'已逾期':'7天內到期'}（${shortDate(x.end)}）</span></div>
      ${ctx}
    </div>`;
  });
  const taskBody=paginatedBody('task', taskItemsHtml, `<div class="small">✓ 目前沒有任務層級的急迫項目</div>`);

  // 尚未指派的任務項目（不管專案狀態，只看單一任務項目本身）
  const unassignedTasks=[];
  ALLP.forEach(p=>{
    if(getRow(p.id).status==="已完成") return;
    taskList(p).forEach(tn=>{
      const subs=materializedSubs(p.id,tn);
      if(subs.length){ subs.forEach(s=>{ if(!s.done && !s.assignee) unassignedTasks.push({p,label:`${tn}／${s.name}`,end:s.end}); }); }
      else { const info=taskInfo(p,tn); if(!info.done && !info.assignee) unassignedTasks.push({p,label:tn,end:info.end}); }
    });
  });
  unassignedTasks.sort((a,b)=>{ if(a.end&&b.end) return a.end.localeCompare(b.end); if(a.end) return -1; if(b.end) return 1; return 0; });
  const unassignedItemsHtml=unassignedTasks.map(x=>`<div class="prow" onclick="goToProject('${x.p.id}')" style="cursor:pointer;"><div class="prow-top"><span class="pname">${getName(x.p)} － ${x.label}</span><span class="small" style="color:var(--warn);">尚未指派${x.end?`・迄 ${shortDate(x.end)}`:''}</span></div></div>`);
  const stagnantBody=paginatedBody('unassigned', unassignedItemsHtml, `<div class="small">✓ 目前沒有尚未指派的任務項目</div>`);

  // 成本壓力
  const overCost=ALLP.filter(p=>{ const r=getRow(p.id); return r.cost!==null && r.cost!=="" && Number(r.cost)/getEstRev(p)>=0.6; })
    .sort((a,b)=>(Number(getRow(b.id).cost)/getEstRev(b))-(Number(getRow(a.id).cost)/getEstRev(a)));
  const costItemsHtml=overCost.map(p=>{const r=getRow(p.id); const ratio=Math.round(Number(r.cost)/getEstRev(p)*100); const isOver=ratio>=100;return `<div class="prow" onclick="goToProject('${p.id}')" style="cursor:pointer;"><div class="prow-top"><span class="pname">${getName(p)}</span><span class="cat">${p.cat}</span>${assigneeTag(r.assignee)}<span class="small" style="color:${isOver?'var(--warn)':'var(--accent2)'};font-weight:600;">${isOver?'已超支':'成本壓力'} ${ratio}%</span></div></div>`;});
  const costBody=paginatedBody('cost', costItemsHtml, `<div class="small">✓ 沒有成本壓力超過60%的專案</div>`);

  const personTabs=[
    {key:'urgent', label:`急迫案件 (${execGroup.length})`, body:urgentBody},
    {key:'task', label:`任務急迫 (${taskUrgent.length})`, body:taskBody},
    {key:'stagnant', label:`未指派任務 (${unassignedTasks.length})`, body:stagnantBody},
    {key:'cost', label:`成本壓力 (${overCost.length})`, body:costBody},
    {key:'pay', label:`待收款 (${payGroup.length})`, body:payBody},
  ];
  const projectTabs=[
    {key:'month', label:`月營收分布`, body:monthlyChartBody()},
  ];
  const tabs = view==="person" ? personTabs : projectTabs;
  const tabBtns = tabs.length>1 ? `<div class="dtabs" style="margin-bottom:2px;">${tabs.map(tb=>`<button class="dtab ${priorityTab===tb.key?'active':''}" onclick="setPriorityTab('${tb.key}')">${tb.label}</button>`).join('')}</div>` : '';
  const active=tabs.find(tb=>tb.key===priorityTab)||tabs[0];
  box.innerHTML=`<div class="priority plain">${tabBtns}${active.body}</div>`;
}

function monthOptsQ(sel){ let s='<option value="">未填</option>'; [9,10,11,12].forEach(m=>{ s+=`<option value="${m}" ${sel===m?'selected':''}>${m}月</option>`; }); return s; }
function monthlyChartBody(){
  const confirmed={9:0,10:0,11:0,12:0}, estimated={9:0,10:0,11:0,12:0};
  ALLP.forEach(p=>{
    const receipts=getReceipts(p.id);
    const fm=Number(getRange(p).end.split('-')[1]);
    const confirmedMonths=new Set();
    receipts.forEach(rc=>{
      const amt=Number(rc.amount||0);
      const m=(rc.month && confirmed[rc.month]!==undefined) ? rc.month : fm;
      confirmed[m]+=amt;
      confirmedMonths.add(m);
    });
    const plan=planScaled(p);
    if(plan){
      [9,10,11,12].forEach((m,i)=>{
        if(!confirmedMonths.has(m)) estimated[m]+=plan[i];
      });
    } else if(!confirmedMonths.has(fm)){
      estimated[fm]+=getEstRev(p);
    }
  });
  const totals={}; [9,10,11,12].forEach(m=>totals[m]=confirmed[m]+estimated[m]);
  const max=Math.max(...Object.values(totals),1);
  return `<div class="chartbars">
      ${[9,10,11,12].map(m=>{
        const totalH=Math.max(4,Math.round(totals[m]/max*70));
        const confH=totals[m]?Math.round(confirmed[m]/totals[m]*totalH):0;
        const estH=totalH-confH;
        return `<div class="chartcol">
          <div class="chartstack">
            <div class="chartbar estimated" style="height:${estH}px;"></div>
            <div class="chartbar confirmed" style="height:${confH}px;"></div>
          </div>
          <div class="small" style="margin-top:4px;">${m}月</div>
          <div class="small">${fmt(totals[m])}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="small" style="margin-top:6px;">淺色＝依原始預算表安排、還沒開發票的月份估算；深色＝那個月已在「實際收款」登錄發票，用實收金額取代原本的估算（不會重複累加）。新增專案沒有原始月份規劃，暫依截止日估算。</div>`;
}

function renderStats(){
  const coreRev=ALLP.filter(p=>!isNonOp(p)).reduce((s,p)=>s+getEstRev(p),0);
  const nonOpRev=ALLP.filter(p=>isNonOp(p)).reduce((s,p)=>s+getEstRev(p),0);
  let tDone=0,tAll=0; ALLP.forEach(p=>{const t=taskProgress(p); tDone+=t.done; tAll+=t.total;});
  const pct=tAll?Math.round(tDone/tAll*100):0;
  let actualSum=0,actualCount=0,costSum=0,costCount=0;
  ALLP.forEach(p=>{const r=getRow(p.id);
    { const list=getReceipts(p.id); if(list.length){ actualSum+=list.reduce((s,x)=>s+Number(x.amount||0),0); actualCount++; } }
    if(r.cost!==null && r.cost!==""){costSum+=Number(r.cost); costCount++;}
  });
  document.getElementById("stats").innerHTML=`
    <div class="statgroup">
      <div class="statgrouplabel">財務</div>
      <div class="stats">
        <div class="stat clickable" onclick="gotoStatus('全部')"><b>${ALLP.length}</b><span>專案總數</span></div>

        <div class="stat"><b>${fmt(actualSum)}</b><span>實際收款合計（${actualCount}／${ALLP.length}筆已登錄）</span></div>
        <div class="stat"><b style="color:${costSum>(coreRev+nonOpRev)?'var(--warn)':'var(--ink)'}">${fmt(costSum)}</b><span>累積成本合計（${costCount}／${ALLP.length}筆已登錄）</span></div>
        <div class="stat"><b style="color:${(coreRev+nonOpRev-costSum)<0?'var(--warn)':'var(--ok)'}">${fmt(coreRev+nonOpRev-costSum)}</b><span>專案毛利合計（營收－成本，自動算）</span></div>

}

function ganttRows(p){

  taskList(p).forEach((t)=>{

    if(subs.length){
      subs.forEach(s=>{ rows.push({group:t, label:s.name, start:s.start, end:s.end, assignee:s.assignee, done:s.done}); });
    } else {
      const info=taskInfo(p,t);
      rows.push({group:null, label:t, start:info.start, end:info.end, assignee:info.assignee, done:info.done});
    }
  });
  return rows;
}
function ganttHtml(p){
  const rows=ganttRows(p);
  const dated=rows.filter(r=>r.start&&r.end);
  const undated=rows.filter(r=>!r.start||!r.end);
  if(!dated.length){
    const undatedHtml0=undated.length?`<div class="small" style="margin-top:6px;">尚未標日期：${undated.map(r=>r.label).join('、')}（在下面任務清單填開始/截止日就會出現在圖上）</div>`:'';
    return `<div class="gantt"><div class="small">目前沒有任何任務標了開始/截止日，先在下面任務清單裡加就會自動畫出來。</div>${undatedHtml0}</div>`;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const proj=getRange(p);
  const rangeStart=new Date(proj.start+"T00:00:00");
  const rangeEnd=new Date(proj.end+"T00:00:00");
  const totalMs=(rangeEnd-rangeStart)||1;
  const totalDays=Math.max(1,Math.round(totalMs/86400000));
  const todayPct=(today>=rangeStart && today<=rangeEnd) ? ((today-rangeStart)/totalMs*100) : null;
  const outOfRange=dated.filter(r=>r.start<proj.start || r.end>proj.end);
  const gridLines=[]; const weekLabels=[];
  for(let d=0; d<=totalDays; d+=7){
    gridLines.push(d/totalDays*100);
    if(d<totalDays){
      const wd=new Date(rangeStart); wd.setDate(wd.getDate()+d);
      const wom=Math.ceil(wd.getDate()/7);
      weekLabels.push({pct:d/totalDays*100, label:`${wd.getMonth()+1}月W${wom}`});
    }
  }
  const overlayHtml=gridLines.map(pct=>`<div class="ganttgrid" style="left:${pct}%;"></div>`).join('')
    + (todayPct!==null?`<div class="ganttToday" style="left:${todayPct}%;"></div>`:'');
  const pct=(iso)=>{ const d=new Date(iso+"T00:00:00"); const c=d<rangeStart?rangeStart:(d>rangeEnd?rangeEnd:d); return (c-rangeStart)/totalMs*100; };
  const dayCount=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)+1;

  // pre-compute each group's min/max span
  const groupSpan={};
  dated.forEach(r=>{ if(!r.group) return; if(!groupSpan[r.group]) groupSpan[r.group]={min:r.end,max:r.end}; if(r.end<groupSpan[r.group].min) groupSpan[r.group].min=r.end; if(r.end>groupSpan[r.group].max) groupSpan[r.group].max=r.end; });

  let lastGroup=undefined;
  let curGroupExpanded=true;
  const barsHtml=dated.map(r=>{
    const isPoint=r.start===r.end;
    const leftPct=pct(r.start);
    const widthPct=isPoint?0:Math.max(2,pct(r.end)-pct(r.start));
    const cls=r.assignee?(isStaff(r.assignee)?'ganttbar-staff':isVendor(r.assignee)?'ganttbar-vendor':'ganttbar-partner'):'ganttbar-none';
    const dateLabel=isPoint?shortDate(r.start):`${shortDate(r.start)}–${shortDate(r.end)}`;
    const markerHtml=isPoint
      ? `<div class="ganttmilestone ${cls} ${r.done?'ganttbar-done':''}" style="left:${leftPct}%;" title="${dateLabel}${r.done?'（已完成）':''}"></div>`
      : `<div class="ganttbar ${cls} ${r.done?'ganttbar-done':''}" style="left:${leftPct}%;width:${widthPct}%;" title="${dateLabel}${r.done?'（已完成）':''}"></div>`;
    const dateTag=`<span class="ganttdate" style="left:calc(${leftPct}% + ${widthPct}% + 8px);">${dateLabel}</span>`;
    let groupHeader='';
    if(r.group!==lastGroup){
      lastGroup=r.group;
      if(r.group){
        const key=p.id+'::'+r.group;
        curGroupExpanded=!!ganttGroupExpanded[key];
        const sp=groupSpan[r.group];
        const gLeft=pct(sp.min), gWidth=Math.max(4,pct(sp.max)-pct(sp.min));
        const gLabel=sp.min===sp.max?shortDate(sp.min):`${shortDate(sp.min)}–${shortDate(sp.max)}`;
        const gDays=dayCount(sp.min,sp.max);
        groupHeader=`<div class="ganttrow ganttgrouprow" onclick="toggleGanttGroup('${p.id}','${r.group}')" style="cursor:pointer;">
          <div class="ganttlabel"><span class="arrow">${curGroupExpanded?'▾':'▸'}</span><b>${r.group}</b></div>
          <div class="ganttbararea">${overlayHtml}<div class="ganttbar ganttbar-group" style="left:${gLeft}%;width:${gWidth}%;"></div><span class="ganttdate" style="left:calc(${gLeft}% + ${gWidth}% + 8px);">${gLabel}（共${gDays}天）</span></div>
        </div>`;
      } else { curGroupExpanded=true; }
    }
    if(r.group && !curGroupExpanded) return groupHeader;
    const labelText = r.group ? `　└ ${r.label}` : r.label;
    return `${groupHeader}<div class="ganttrow ${r.group?'ganttchildrow':''}">
      <div class="ganttlabel">${labelText}${r.assignee?` <span class="small">・${r.assignee}</span>`:''}</div>
      <div class="ganttbararea">${overlayHtml}${markerHtml}${dateTag}</div>
    </div>`;
  }).join('');
  const undatedHtml=undated.length?`<div class="small" style="margin-top:6px;">尚未標日期：${undated.map(r=>r.label).join('、')}（在下面任務清單填開始/截止日就會出現在圖上）</div>`:'';
  const outOfRangeHtml=outOfRange.length?`<div class="small" style="margin-top:6px;color:var(--warn);">⚠ 以下任務超出專案起訖範圍（${shortDate(proj.start)}–${shortDate(proj.end)}），圖上會裁切在邊界，建議修改任務日期或調整專案起訖日：${outOfRange.map(r=>`${r.label}（${shortDate(r.start)===shortDate(r.end)?shortDate(r.start):shortDate(r.start)+'–'+shortDate(r.end)}）`).join('、')}</div>`:'';
  const weekHeaderHtml=`<div class="ganttrow ganttweekrow">
    <div class="ganttlabel"></div>
    <div class="ganttbararea">${weekLabels.map(w=>`<span class="ganttweeklabel" style="left:${w.pct}%;">${w.label}</span>`).join('')}</div>
  </div>`;
  const minWidthPx=Math.max(500, Math.round(totalDays*8));
  const body=`<div class="ganttscroll"><div class="ganttinner" style="min-width:${minWidthPx}px;">
       <div class="gantthead">
         <div class="ganttaxis"><span>${shortDate(proj.start)}</span><span>${shortDate(proj.end)}</span></div>
         ${weekHeaderHtml}
       </div>
       <div class="ganttbody">${barsHtml}</div>
       </div></div>`;
  return `<div class="gantt">${body}${undatedHtml}${outOfRangeHtml}</div>`;
}

function detailRow(p){

function personInvolved(t){
  const ids=new Set();
  ALLP.forEach(p=>{ const r=getRow(p.id); if(r.assignee===t||collaboratorsOf(p).includes(t)) ids.add(p.id); });
  return [...ids].map(getProject);
}
function personTop(t){
  const unfinished=personInvolved(t).filter(p=>getRow(p.id).status!=="已完成");
  if(!unfinished.length) return null;
  unfinished.sort((a,b)=>URG_RANK[urgency(a)]-URG_RANK[urgency(b)] || new Date(getRange(a).end)-new Date(getRange(b).end));
  return unfinished[0];
}
function assigneeTag(name){
  if(!name) return `<span class="small" style="color:var(--warn);">未指派</span>`;
  const cls = isStaff(name)?'tag-staff' : isVendor(name)?'tag-vendor' : 'tag-partner';
  return `<span class="${cls}">${name}</span>`;
}
function projRowHtml(p,badgeHtml){
  const r=getRow(p.id);
  const tp=taskProgress(p);
  const pct=tp.total?Math.round(tp.done/tp.total*100):0;
  const badge=badgeHtml||`<span class="badge ${urgency(p)}">${URG_LABEL[urgency(p)]}</span>`;
  return `<div class="prow" onclick="goToProject('${p.id}')" style="cursor:pointer;">
    <div class="prow-top"><span class="pname">${getName(p)}</span><span class="cat">${p.cat}</span>${assigneeTag(r.assignee)}${badge}</div>
    <div class="prow-bottom"><span>${r.status}・迄 ${shortDate(getRange(p).end)}</span><span>任務 ${tp.done}/${tp.total}（${pct}%）</span></div>
  </div>`;
}
function personMonthlyHtml(t){
  const items=[];
  ALLP.forEach(p=>{
    taskList(p).forEach(tn=>{
      const subs=materializedSubs(p.id,tn);
      const pushIt=(name,info)=>{ if(info.assignee===t && info.end){ items.push({ym:info.end.slice(0,7), date:info.end, proj:getName(p), task:name, done:info.done}); } };
      if(subs.length){ subs.forEach(s=>pushIt(s.name,s)); }
      else { pushIt(tn, taskInfo(p,tn)); }
    });
  });
  const today=new Date(); const todayYm=`${today.getFullYear()}-${pad(today.getMonth()+1)}`;
  if(!items.length) return `<div class="small">目前沒有標日期的任務</div>`;
  let yms=[...new Set(items.map(i=>i.ym).concat([todayYm]))].sort();
  const cols=yms.map(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const label=(y!==REF_YEAR?y+'/':'')+m+'月';
    const rows=items.filter(i=>i.ym===ym).sort((a,b)=>a.date.localeCompare(b.date));
    const body=rows.length? rows.map(it=>`<div class="monthitem${it.done?' done':''}">${shortDate(it.date)} <span class="monthproj">${it.proj}</span>：${it.task}</div>`).join('') : '<div class="small">（無）</div>';
    return `<div class="monthcol"><div class="monthcolhead">${label}</div>${body}</div>`;
  }).join('');
  return `<div class="monthgridscroll"><div class="monthgrid">${cols}</div></div>`;
}
function personDetailHtml(t){
  const owned=ALLP.filter(p=>getRow(p.id).assignee===t)
    .sort((a,b)=>URG_RANK[urgency(a)]-URG_RANK[urgency(b)] || new Date(getRange(a).end)-new Date(getRange(b).end));
  const collab=ALLP.filter(p=>collaboratorsOf(p).includes(t) && getRow(p.id).assignee!==t)
    .sort((a,b)=>URG_RANK[urgency(a)]-URG_RANK[urgency(b)] || new Date(getRange(a).end)-new Date(getRange(b).end));
  let myTasks=[];
  ALLP.forEach(p=>{
    taskList(p).forEach((tn,idx)=>{
      const subs=materializedSubs(p.id,tn);
      if(subs.length){ subs.forEach((s,si)=>{ if(s.assignee===t) myTasks.push({p,idx,si,name:tn+'／'+s.name,done:s.done}); }); }
      else { const info=taskInfo(p,tn); if(info.assignee===t) myTasks.push({p,idx,si:null,name:tn,done:info.done}); }
    });
  });
  const ownedHtml=owned.map(p=>projRowHtml(p)).join("")||'<div class="prow small">（無）</div>';
  const collabHtml=collab.map(p=>projRowHtml(p)).join("")||'<div class="prow small">（無）</div>';

  // 我的待辦：只列還沒做完的，依專案分組，專案名稱不重複
  const pending=myTasks.filter(x=>!x.done);
  const byProject=new Map();
  pending.forEach(x=>{ const k=x.p.id; if(!byProject.has(k)) byProject.set(k,[]); byProject.get(k).push(x); });
  const projIds=[...byProject.keys()].sort((a,b)=>{
    const pa=getProject(a), pb=getProject(b);
    return URG_RANK[urgency(pa)]-URG_RANK[urgency(pb)] || new Date(getRange(pa).end)-new Date(getRange(pb).end);
  });
  const TODO_LIMIT=3;
  const todoIsExpanded=todoExpandedSet.has(t);
  const shownIds = todoIsExpanded ? projIds : projIds.slice(0,TODO_LIMIT);
  const todoHtml = shownIds.length ? shownIds.map(pid=>{
    const p=getProject(pid); const items=byProject.get(pid);
    const lines=items.map(x=>{
      const cb=x.si===null
        ? `<input type="checkbox" onchange="toggleTask('${x.p.id}',${x.idx},this.checked)">`
        : `<input type="checkbox" onchange="toggleSubtask('${x.p.id}',${x.idx},${x.si},this.checked)">`;
      return `<label class="todochip">${cb}<span>${x.name}</span></label>`;
    }).join("");
    return `<div class="todogroup">
      <div class="todohead"><span class="pname">${getName(p)}</span><span class="cat">${p.cat}</span><span class="badge ${urgency(p)}">${URG_LABEL[urgency(p)]}</span></div>
      <div class="todochips">${lines}</div>
    </div>`;
  }).join("") : `<div class="prow small">🎉 目前沒有待辦任務</div>`;
  const moreBtn = projIds.length>TODO_LIMIT
    ? (todoIsExpanded
        ? `<button class="mini" onclick="toggleTodoExpand('${t}')" style="margin-top:6px;">只顯示最急的${TODO_LIMIT}個</button>`
        : `<button class="mini" onclick="toggleTodoExpand('${t}')" style="margin-top:6px;">顯示全部（共${projIds.length}個待辦專案）</button>`)
    : '';
  const doneCount=myTasks.length-pending.length;
  const ocExpanded=ownedCollabExpandedSet.has(t);
  const ocPane = ocExpanded ? `
    <h3 style="margin-top:16px;">負責的專案（依急迫度排序）</h3>${ownedHtml}
    <h3 style="margin-top:14px;">協作的專案（依急迫度排序）</h3>${collabHtml}` : '';

  return `<div class="priority plain persondetail">
    <h3 style="color:var(--ink);">我的待辦事項${pending.length?`（${pending.length}項）`:''}</h3>
    ${todoHtml}
    ${moreBtn}
    ${doneCount?`<div class="small" style="margin-top:6px;">已完成 ${doneCount} 項（不列出）</div>`:''}
    <h3 style="margin-top:16px;">本季每月重點（依截止日）</h3>
    ${personMonthlyHtml(t)}
    <button class="mini" style="margin-top:12px;" onclick="toggleOwnedCollab('${t}')">${ocExpanded?'收合':'顯示'}負責／協作專案清單（${owned.length}負責・${collab.length}協作）</button>
    ${ocPane}
  </div>`;
}

function personCard(t){
  const group=isStaff(t)?'staff':'partner';
  const owned=ALLP.filter(p=>getRow(p.id).assignee===t);
  const collabOn=ALLP.filter(p=>collaboratorsOf(p).includes(t));
  const activeOwned=owned.filter(p=>getRow(p.id).status!=="已完成");
  let taskCount=0;
  ALLP.forEach(p=>taskList(p).forEach((tn)=>{
    const subs=materializedSubs(p.id,tn);
    if(subs.length){ taskCount+=subs.filter(s=>s.assignee===t).length; }
    else if(taskInfo(p,tn).assignee===t){ taskCount++; }
  }));
  const top=personTop(t);
  const topHtml=top
    ? `<div class="small" style="margin-top:5px;">🔺最優先：${getName(top)} <span class="badge ${urgency(top)}">${URG_LABEL[urgency(top)]}</span></div>`
    : `<div class="small" style="margin-top:5px;color:var(--ok);">✓ 目前沒有急件</div>`;
  const open=expandedPerson.has(t);
  const role=ROLES[t];
  return `<div class="pcard ${group}" onclick="togglePerson('${t}')" style="cursor:pointer;">
      <b>${t}${role?` <span class="rolelabel">・${role}</span>`:''}</b><span>負責 ${activeOwned.length}/${owned.length} 案・協作 ${collabOn.length} 案・${taskCount} 項任務</span>${topHtml}
    </div>${open?personDetailHtml(t):''}`;
}


function vendorCard(v){

    else if(taskInfo(p,tn).assignee===v){ taskCount++; }

  return `<div class="pcard" style="border-left-color:#c9a227;">
      <div style="display:flex;justify-content:space-between;align-items:center;">

      <span>${taskCount} 項任務</span>
    </div>`;
}

function localBackupSave(){ try{ localStorage.setItem('dash_backup_v2', JSON.stringify(state)); }catch(e){} }
function localBackupLoad(){ try{ const s=localStorage.getItem('dash_backup_v2'); return s?JSON.parse(s):null; }catch(e){ return null; } }
function showRestoreBanner(backup){
  const box=document.getElementById("restorebanner");
  box.innerHTML=`<div class="priority" style="margin-bottom:14px;">
    <h3>偵測到你這台裝置有尚未同步的本機備份資料</h3>
    <div class="small">Google Sheet裡目前是空的，但這個瀏覽器裡有之前留下的資料。要匯入嗎？（匯入後會立刻同步給所有人）</div>
    <div style="margin-top:8px;display:flex;gap:8px;">
      <button onclick="restoreBackup()" style="padding:5px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;">匯入本機備份</button>
      <button class="mini" onclick="document.getElementById('restorebanner').innerHTML=''">忽略</button>
    </div>
  </div>`;
  window._pendingBackup=backup;
}
window.restoreBackup=async function(){
  if(window._pendingBackup){ state=window._pendingBackup; }
  document.getElementById("restorebanner").innerHTML="";
  render(); await persist();
};

function setHint(msg,isWarn){
  const hint=document.getElementById("synchint");
  hint.textContent=msg;
  hint.style.color=isWarn?"var(--warn)":"";
}
function sheetConfigured(){ return SHEET_API_URL && !SHEET_API_URL.includes("PASTE_"); }

async function loadFromSheet(){
  if(!sheetConfigured()){
    setHint("尚未設定 Google Sheet 網址，目前只存在你這台瀏覽器（單機模式）。",true);
    const backup=localBackupLoad(); if(backup) state=backup;
    render();
    return;
  }
  try{
    const res=await fetch(SHEET_API_URL,{method:"GET"});
    const data=await res.json();
    if(data && Object.keys(data).length>0){
      state=data;
    } else {
      const backup=localBackupLoad();
      if(backup && Object.keys(backup).length>0) showRestoreBanner(backup);
    }
    setHint("已連接 Google Sheet：重新整理或按「重新整理資料」可看到其他人的更新。");
    render();
  }catch(e){
    console.error(e);
    setHint("⚠ 連不到 Google Sheet（可能網址錯誤或還沒部署好），目前顯示你這台瀏覽器的本機備份。",true);
    const backup=localBackupLoad(); if(backup) state=backup;
    render();
  }
}
window.manualRefresh=function(){ loadFromSheet(); };

async function persist(){
  localBackupSave();
  if(!sheetConfigured()){ setHint("尚未設定 Google Sheet 網址，這次修改只存在你這台瀏覽器。",true); return; }
  try{
    await fetch(SHEET_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(state)});
    setHint("已連接 Google Sheet：重新整理或按「重新整理資料」可看到其他人的更新。");
  }catch(e){
    console.error(e);
    setHint("⚠ 這次修改可能沒有同步到 Google Sheet（已存一份在你這台瀏覽器）。請檢查網路後按「重新整理資料」重試。",true);
  }
}

window.setField=async function(id,field,val){ const cur=getRow(id); state[id]=Object.assign({},cur,{[field]:val}); touch(id); render(); await persist(); };
window.saveName=async function(pid,val){
  const v=(val||'').trim(); if(v===''){ render(); return; }
  const cur=getRow(pid); state[pid]=Object.assign({},cur,{nameOverride:v}); touch(pid);
  render(); await persist();
};
window.saveRev=async function(pid,val){
  const num=val===''?null:Number(val);
  const cur=getRow(pid); state[pid]=Object.assign({},cur,{estOverride:num}); touch(pid);
  render(); await persist();
};
window.toggleTask=async function(pid,idx,checked){
  const p=getProject(pid); const t=taskList(p)[idx]; const cur=getRow(pid);
  const prev=cur.tasks[t]||{};
  const tasks=Object.assign({},cur.tasks,{[t]:Object.assign({},prev,{done:checked})});
  state[pid]=Object.assign({},cur,{tasks}); touch(pid); render(); await persist();
};
window.setTaskAssignee=async function(pid,idx,val){
  if(val==='__vendor__'){ const name=prompt('請輸入委外單位名稱：'); if(!name||!name.trim()){ render(); return; } val=name.trim(); }
  const p=getProject(pid); const t=taskList(p)[idx]; const cur=getRow(pid);
  const prev=cur.tasks[t]||{};
  const tasks=Object.assign({},cur.tasks,{[t]:Object.assign({},prev,{assignee:val})});
  state[pid]=Object.assign({},cur,{tasks}); touch(pid); render(); await persist();
};
window.setTaskDate=async function(pid,idx,field,val){
  const p=getProject(pid); const t=taskList(p)[idx]; const cur=getRow(pid);
  const prev=cur.tasks[t]||{};
  const tasks=Object.assign({},cur.tasks,{[t]:Object.assign({},prev,{[field]:val})});
  state[pid]=Object.assign({},cur,{tasks}); touch(pid); render(); await persist();
};

window.deleteCustomTask=async function(pid,idx){
  const p=getProject(pid); const pos=customPos(p,idx); const name=taskList(p)[idx]; const cur=getRow(pid);
  if(!confirm(`確定要刪除「${name}」這個任務嗎？底下的子項目也會一併移除。`)) return;
  lastDeleteSnapshot={pid,row:JSON.parse(JSON.stringify(cur))};
  const custom=cur.custom.slice(); custom.splice(pos,1);
  const tasks=Object.assign({},cur.tasks); delete tasks[name];
  const subtasks=Object.assign({},cur.subtasks); delete subtasks[name];
  const taskOrder=(cur.taskOrder||[]).filter(k=>k!==name);

};
window.renameCustomTask=async function(pid,idx,newName){
  const p=getProject(pid); const pos=customPos(p,idx); const cur=getRow(pid);
  const oldName=cur.custom[pos]; const nn=(newName||'').trim(); if(!nn||nn===oldName){ render(); return; }
  const custom=cur.custom.slice(); custom[pos]=nn;
  const tasks=Object.assign({},cur.tasks); if(tasks[oldName]!==undefined){ tasks[nn]=tasks[oldName]; delete tasks[oldName]; }
  const subtasks=Object.assign({},cur.subtasks); if(subtasks[oldName]!==undefined){ subtasks[nn]=subtasks[oldName]; delete subtasks[oldName]; }
  const taskOrder=(cur.taskOrder||[]).map(k=>k===oldName?nn:k);
  state[pid]=Object.assign({},cur,{custom,tasks,subtasks,taskOrder}); touch(pid); render(); await persist();
};
window.renameBaseTask=async function(pid,idx,newName){
  const p=getProject(pid); const raw=rawBaseNameAt(p,idx); if(!raw) return;
  const cur=getRow(pid);
  const prevDisplay=cur.taskRenames[raw]||raw;
  const nd=(newName||'').trim(); if(!nd||nd===prevDisplay){ render(); return; }
  const taskRenames=Object.assign({},cur.taskRenames,{[raw]:nd});
  const tasks=Object.assign({},cur.tasks); if(tasks[prevDisplay]!==undefined){ tasks[nd]=tasks[prevDisplay]; if(nd!==prevDisplay) delete tasks[prevDisplay]; }
  const subtasks=Object.assign({},cur.subtasks); if(subtasks[prevDisplay]!==undefined){ subtasks[nd]=subtasks[prevDisplay]; if(nd!==prevDisplay) delete subtasks[prevDisplay]; }
  state[pid]=Object.assign({},cur,{taskRenames,tasks,subtasks}); touch(pid); render(); await persist();
};

window.syncPaymentSubtasks=async function(pid){
  const p=getProject(pid); const cur=getRow(pid);
  const method=cur.paymentMethod;
  if(!method){ alert('請先選擇付款方式'); return; }
  let names=[];
  if(method==='一次付清') names=['全額'];
  else if(method==='訂金+尾款') names=['訂金','尾款'];
  else { const n=Math.max(1,Number(cur.installmentCount)||2); for(let i=1;i<=n;i++) names.push(`第${i}期`); }
  const target=findTaskDisplayByRaw(p,'款項');
  if(!target){ alert('找不到「款項」這個任務（可能已被刪除或改名），請確認任務清單裡還有這一項。'); return; }
  if(!confirm(`將「${target}」底下的子項目換成：${names.join('、')}？\n（會覆蓋掉這個任務目前的子項目）`)) return;
  const newSubs=names.map(nm=>({name:nm,done:false,assignee:'',start:'',end:''}));
  const subtasks=Object.assign({},cur.subtasks,{[target]:newSubs});
  expanded.add(pid); state[pid]=Object.assign({},cur,{subtasks}); touch(pid); render(); await persist();
};

window.renameVendor=async function(oldName){
  const input=prompt(`將委外單位「${oldName}」改名為：`, oldName);
  if(!input) return;
  const nn=input.trim();
  if(!nn || nn===oldName) return;
  if(TEAM.includes(nn)){ alert('這個名字跟現有的員工/夥伴重複，請換一個名字。'); return; }
  let changedCount=0;
  ALLP.forEach(p=>{
    const cur=getRow(p.id);
    let changed=false;
    const tasks=Object.assign({},cur.tasks);
    Object.keys(tasks).forEach(k=>{
      const t=tasks[k];
      if(t && typeof t==='object' && t.assignee===oldName){ tasks[k]=Object.assign({},t,{assignee:nn}); changed=true; }
    });
    const subtasks=Object.assign({},cur.subtasks);
    Object.keys(subtasks).forEach(k=>{
      const arr=subtasks[k];
      if(Array.isArray(arr)){
        let arrChanged=false;
        const newArr=arr.map(s=>{ if(s && s.assignee===oldName){ arrChanged=true; return Object.assign({},s,{assignee:nn}); } return s; });
        if(arrChanged){ subtasks[k]=newArr; changed=true; }
      }
    });
    if(changed){ state[p.id]=Object.assign({},cur,{tasks,subtasks}); touch(p.id); changedCount++; }
  });
  if(changedCount===0){ alert('沒有找到指派給這個名字的任務。'); return; }
  render();
  await persist();
};
